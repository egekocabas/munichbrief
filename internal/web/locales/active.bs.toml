[PrivacyRequiredCopy]
other = "MunichBrief možete čitati bez korisničkog računa i bez obraćanja nama. Nemate zakonsku ni ugovornu obavezu koristiti kontakt obrazac. Za slanje obrasca potrebni su e-mail adresa, tema i poruka kako bismo obradili upit i odgovorili vam. Bez tih podataka obrazac nije moguće poslati. Možete nam pisati i direktno e-mailom. Navedite samo lične podatke potrebne za vaš upit."

