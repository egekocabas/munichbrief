[PrivacyObjectionCopy]
other = "Kada se primjenjuje član 21. GDPR-a, u svakom trenutku možete prigovoriti obradi zasnovanoj na legitimnim interesima zbog razloga povezanih s vašom posebnom situacijom. Prigovor pošaljite na gore navedenu kontakt adresu. Tu ćemo obradu obustaviti osim ako dokažemo uvjerljive legitimne razloge koji prevladavaju nad vašim pravima ili je obrada potrebna za postavljanje, ostvarivanje ili odbranu pravnih zahtjeva."

