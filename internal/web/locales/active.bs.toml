[PrivacyControllerCopy]
other = "Ege Kocabaş lično vodi MunichBrief iz Bavarske u Njemačkoj. Gornja adresa služi za prepisku. Pitanja o obradi ličnih podataka možete poslati poštom ili na navedenu e-mail adresu."

[PrivacyHostingCopy]
other = "Web-stranica, baza podataka i svi postupci vještačke inteligencije rade na vlastitoj opremi operatera u Njemačkoj. Izvorni tekstovi ne šalju se vanjskom pružaocu usluga vještačke inteligencije."

[PrivacyCloudflareCopy]
other = "Cloudflare omogućava pristup stranici i štiti je, obrađujući podatke o vezi, uključujući IP adrese. Može praviti i statistike na svojoj mreži. Web Analytics isključuje posjetioce iz EU-a, a drugdje automatski ubacuje skriptu za mjerenje; sigurnosna pravila preglednika mogu spriječiti njeno izvršavanje. Obrada za isporuku i sigurnost je odvojena. Zaraz Consent Management i Google Tag Gateway nisu aktivni. Isporuka i zaštita zasnivaju se na legitimnom interesu za siguran rad (član 6(1)(f) GDPR-a). Politike pružalaca objašnjavaju međunarodne prijenose."

[PrivacyPreferencesCopy]
other = "Vlastiti kolačići pamte jezik godinu dana, potvrdu obavijesti o vještačkoj inteligenciji 30 dana i posljednju pretragu 30 dana u HttpOnly kolačiću. Brisanje pretrage uklanja kriterije. Tema ostaje u lokalnoj pohrani dok je ne izbrišete; povratni položaj liste čuva se za trenutnu karticu. Sigurnosni tokeni obrasca vrijede najviše sat, a potvrde prijema pet minuta; ne sadrže poruku. Ove funkcije omogućavaju traženu uslugu (§25(2)(2) TDDDG-a; član 6(1)(f) GDPR-a). HTMX ne čuva kopije stranica u localStorage. Odabrani redoslijed prikaza pamti se 30 dana u kolačiću ove stranice. Pojmovi za pretragu i filteri dio su adrese stranice te mogu ostati u podijeljenim linkovima i historiji preglednika."

[PrivacyMonitoringCopy]
other = "Tehnički zapisi sadrže metodu, putanju bez parametara pretrage, status, trajanje i identifikatore zahtjeva, ali ne poruke, e-mail adrese, kolačiće ni IP adrese posjetilaca. Prometheus i Loki podešeni su na čuvanje 30 dana; Grafana prikazuje interne podatke. Za ograničavanje pokušaja kontakta čuvamo brojač i pseudonimnu oznaku izvedenu iz IP adrese samo u memoriji aplikacije, bez pohranjivanja izvorne IP adrese. Ograničenje traje 15 minuta od prvog pokušaja. Istekli brojači uklanjaju se pri sljedećem pokušaju kontakta ili ponovnom pokretanju aplikacije; ako nema novih pokušaja, mogu ostati u memoriji duže. Svrha je sigurnost i pouzdanost (član 6(1)(f) GDPR-a). Cloudflare ima vlastite rokove."

[PrivacyCorrespondenceCopy]
other = "E-mail adresu, temu i poruku obrađujemo radi odgovora na upit (član 6(1)(f) GDPR-a) ili primjenjive zakonske obaveze (6(1)(c)). Obrazac prvo čuva poruku u privatnom sandučiću baze podataka. SMTP2GO šalje obavijest na contact@munichbrief.de, a Cloudflare Email Routing prosljeđuje je u Gmail. Odgovori se pišu u Apple Mailu i šalju preko SMTP2GO-a. Poruke se ne obrađuju vještačkom inteligencijom. Politike pružalaca opisuju i obradu izvan EGP-a."

[PrivacyRetentionCopy]
other = "Poruke u administratorskom sandučiću automatski se brišu 90 dana nakon označavanja upita riješenim. Ponovno otvaranje poništava rok. Otvoreni upiti pregledaju se i čuvaju dok su potrebni. Spor ili zakonska obaveza mogu opravdati zadržavanje uz zabilježen razlog i datum pregleda. Kopije u Gmailu i poslani odgovori pregledaju se i brišu odvojeno. Pružaoci imaju vlastite rokove za podatke o slanju."

[PrivacyPostCopy]
other = "COCENTER / anschrift.net prima, otvara i skenira pisma kako bi ih operater mogao obraditi. Osnova je legitimni interes za primanje prepiske ili zakonska obaveza (član 6(1)(f) ili (c) GDPR-a). Prema pružaocu, originali se čuvaju šest mjeseci, a skenovi do zatvaranja računa ili zahtjeva za brisanje, osim ako postoji opravdan razlog za čuvanje. Pojedinosti su u njegovoj politici privatnosti."

[PrivacySourcesCopy]
other = "Sažeci nastaju iz javnih saopćenja Polizeipräsidium München. Njemački izvorni tekstovi i tekstualne RSS kopije čuvaju se za obradu, provjeru promjena i pregled s ograničenim pristupom. Za te zapise trenutno nije određen rok brisanja. Javne stranice prikazuju sažetke, a ne sačuvane originale. Javite nam se ako se izvještaj odnosi na vas ili sadrži grešku. Zahtjeve za ispravku i zaštitu privatnosti razmatramo pojedinačno."

[PrivacyRightsCopy]
other = "U zavisnosti od primjenjivih pravila možete zatražiti pristup, ispravku, brisanje, ograničenje i, gdje je primjenjivo, prenosivost, ili prigovoriti obradi na osnovu legitimnog interesa. Račun nije potreban. Na zahtjeve za prava iz GDPR-a obično odgovaramo u roku od mjesec dana; zakonski izuzeci i urednička pravila mogu utjecati na ishod. Za nejavni sektor u Bavarskoj možete se obratiti BayLDA-u ili drugom nadležnom tijelu. Uredničke pritužbe mogu slijediti druga pravila."

