[PrivacySourcePeopleCopy]
other = "Podaci o osobama uključenim u događaje dolaze iz javnih policijskih saopćenja, a ne direktno od tih osoba. Zavisno od saopćenja, mogu obuhvatati opise osoba, njihovu ulogu u događaju, navodna krivična djela, povrede te mjesto i vrijeme događaja. Objavljeni sažeci dostupni su svima i mogu se pojaviti u pretraživačima. Kontakt poruke i privatni pretinac se ne objavljuju."

