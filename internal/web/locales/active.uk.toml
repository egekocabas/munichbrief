AIDisclosureCopy = { other = "MunichBrief використовує локально запущений ШІ, щоб на основі офіційних повідомлень поліції Мюнхена створювати заголовки, огляди, переклади, категорії та структуровані відомості, зокрема про зазначені місце й час та про те, чи просить поліція допомоги громадськості. Створена або виведена ШІ інформація може містити помилки чи застаріти після оновлення оригінального повідомлення. На кожній сторінці події зазначено офіційне джерело поліції та наведено посилання на нього; для отримання достовірної інформації звертайтеся до цього джерела. MunichBrief є незалежним проєктом і не пов’язаний із поліцією Баварії. Кожна згадана особа вважається невинуватою, доки її вину не буде доведено." }
