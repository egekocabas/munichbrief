[PrivacyAutomationCopy]
other = "ШІ виділяє дані, узагальнює, перекладає та перевіряє повідомлення про події. Ми не використовуємо його для ухвалення рішень щодо відвідувачів, які мають правові або подібні істотні наслідки в розумінні статті 22 GDPR. Автоматичні перевірки можуть перешкоджати публікації повідомлення про подію або одного з його перекладів. Тому деякі повідомлення можуть бути доступні не всіма мовами."

