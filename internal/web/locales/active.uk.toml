[PrivacyControllerCopy]
other = "Ege Kocabaş особисто керує MunichBrief із Баварії. Адреса вище призначена для листування. Питання про обробку персональних даних можна надіслати поштою або на вказану електронну адресу."

[PrivacyHostingCopy]
other = "Сайт, база даних і всі процеси ШІ працюють на власному обладнанні оператора в Німеччині. Підсумки, переклади та подальші перевірки виконуються локально; джерела не передаються зовнішнім постачальникам ШІ."

[PrivacyCloudflareCopy]
other = "Cloudflare забезпечує доступ до сайту та захищає його, обробляючи дані з’єднання, зокрема IP-адреси. Він також може формувати статистику у власній мережі. Web Analytics налаштовано на виключення відвідувачів з ЄС і автоматичне додавання вимірювального скрипту в інших регіонах; правила безпеки браузера можуть завадити його виконанню. Обробка для доставки й захисту є окремою. Zaraz Consent Management і Google Tag Gateway неактивні. Доставка й захист ґрунтуються на законному інтересі безпечної роботи (ст. 6(1)(f) GDPR). Політики постачальників описують міжнародні передачі даних."

[PrivacyPreferencesCopy]
other = "Власні cookie зберігають мову один рік, підтвердження повідомлення про ШІ 30 днів, а останні критерії пошуку 30 днів у HttpOnly cookie. Очищення пошуку видаляє критерії. Тема залишається в локальному сховищі до видалення, а позиція повернення до списку — у поточній вкладці. Токени форми діють щонайбільше годину, підтвердження отримання — п’ять хвилин; тексту повідомлень у них немає. Ці функції забезпечують запитану послугу (§25(2)(2) TDDDG; ст. 6(1)(f) GDPR). HTMX не зберігає копій сторінок у localStorage."

[PrivacyMonitoringCopy]
other = "Технічні журнали містять метод, шлях без параметрів пошуку, статус, тривалість та ідентифікатори запитів. Повідомлення, електронні адреси, cookie та IP відвідувачів до них не потрапляють. Prometheus і Loki налаштовано на зберігання 30 днів; Grafana показує ці дані внутрішньо. Для обмеження спроб звернення ми зберігаємо лічильник і псевдонімний ідентифікатор, отриманий з IP, лише в пам’яті застосунку, не зберігаючи саму IP-адресу. Обмеження діє 15 хвилин від першої спроби. Прострочені лічильники видаляються під час наступної спроби звернення або перезапуску застосунку; якщо нових спроб немає, вони можуть залишатися в пам’яті довше. Мета — безпека й надійність (ст. 6(1)(f) GDPR). Cloudflare має власні строки."

[PrivacyCorrespondenceCopy]
other = "Електронну адресу, тему й повідомлення обробляємо для відповіді на звернення (ст. 6(1)(f) GDPR) або виконання відповідного правового обов’язку (6(1)(c)). Форма спочатку зберігає повідомлення в приватній скриньці бази даних. SMTP2GO надсилає сповіщення на contact@munichbrief.de, а Cloudflare Email Routing пересилає його до Gmail. Відповіді пишуться в Apple Mail і надсилаються через SMTP2GO. ШІ не обробляє повідомлення. Політики постачальників описують обробку поза ЄЕЗ; європейський API SMTP2GO не обмежує весь поштовий ланцюг територією ЄС. Сповіщення електронною поштою можна вимкнути. Повідомлення, отримані в цей час, залишаються в закритому розділі вхідних і не надсилаються автоматично поштою згодом."

[PrivacyRetentionCopy]
other = "Повідомлення в адміністративній скриньці автоматично видаляються через 90 днів після позначення звернення вирішеним. Повторне відкриття скасовує строк. Відкриті звернення переглядаються та зберігаються, доки потрібні. Поточний спір або правовий обов’язок може обґрунтовувати подальше зберігання із зазначенням причини й дати перегляду. Копії Gmail і надіслані відповіді переглядаються та видаляються окремо; сайт їх не видаляє. Записи постачальників про надсилання мають власні строки."

[PrivacyPostCopy]
other = "COCENTER / anschrift.net отримує, відкриває та сканує листи для опрацювання оператором. Підстава — законний інтерес в отриманні кореспонденції або правовий обов’язок (ст. 6(1)(f) чи (c) GDPR). За інформацією постачальника, паперові оригінали зберігаються шість місяців, а скани — до закриття облікового запису або запиту на видалення, якщо немає обґрунтованої потреби зберігати далі. Подробиці наведені в його політиці."

[PrivacySourcesCopy]
other = "Підсумки створюються з публічних повідомлень Polizeipräsidium München. Німецькі тексти та текстові знімки RSS зберігаються для обробки, перевірки змін і обмеженого перегляду; автоматичне видалення зараз не налаштовано. Публічні сторінки показують підсумки, а не збережені оригінали. Відсутність імен не гарантує анонімності. Редакційна обробка має відповідати застосовним правилам преси й захисту даних, включно з особливими правилами щодо відомостей про правопорушення. Запити на виправлення та захист даних розглядаються окремо."

[PrivacyRightsCopy]
other = "Залежно від застосовних правил ви можете просити доступ, виправлення, видалення, обмеження, а у відповідних випадках — перенесення даних, або заперечувати проти обробки на підставі законного інтересу. Обліковий запис не потрібен. На запити щодо прав GDPR зазвичай відповідаємо протягом місяця; правові винятки й редакційні правила можуть впливати на результат. Щодо непублічного сектору Баварії можна скаржитися до BayLDA або іншого компетентного органу. Редакційні скарги можуть підпадати під інші правила."

