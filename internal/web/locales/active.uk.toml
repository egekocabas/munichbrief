[PrivacyAutomationCopy]
other = "ШІ виділяє дані, узагальнює, перекладає та перевіряє повідомлення про події. Ми не використовуємо його для ухвалення рішень щодо відвідувачів, які мають правові або подібні істотні наслідки в розумінні статті 22 GDPR. Автоматичні перевірки безпеки можуть тимчасово заблокувати надсилання форми; ви й надалі можете написати нам електронною поштою."

[PrivacyObjection]
