other = "Кожне повідомлення відноситься до однієї репрезентативної місцевості. Перевірені зв’язки між кварталами й офіційними районами дають змогу визначити район; широкі або неоднозначні місця залишаються невизначеними. Місця за межами Мюнхена та невизначені райони входять до загального підсумку, але їх неможливо показати всередині району на карті. Категорії та місця, визначені ШІ, можуть бути помилковими."

