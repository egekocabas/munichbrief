[PrivacySourcePeopleCopy]
other = "Інформація про причетних до подій людей надходить із публічних повідомлень поліції, а не безпосередньо від цих людей. Залежно від повідомлення вона може містити описи осіб, їхню роль у події, ймовірні правопорушення, травми, місце та час події. Опубліковані огляди доступні всім і можуть індексуватися пошуковими системами. Звернення та вміст приватної скриньки не публікуються."

