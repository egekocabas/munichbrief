[PrivacyObjectionCopy]
other = "Якщо застосовується стаття 21 GDPR, ви можете будь-коли заперечити проти обробки на підставі законних інтересів з причин, пов’язаних із вашою конкретною ситуацією. Надішліть заперечення за контактною адресою вище. Ми припинимо таку обробку, якщо не доведемо наявність вагомих законних підстав, що переважають ваші права, або необхідність обробки для встановлення, здійснення чи захисту правових вимог."

