[PrivacyRequiredCopy]
other = "Читати MunichBrief можна без облікового запису та без звернення до нас. Закон або договір не зобов’язує вас користуватися контактною формою. Для її надсилання потрібні адреса електронної пошти, тема й повідомлення, щоб ми могли розглянути звернення та відповісти. Без цих полів форму надіслати неможливо. Натомість можна написати нам електронною поштою. Надавайте лише особисті дані, необхідні для вашого звернення."

