[AITransparencyEUCopy]
other = "MunichBrief verwendet das EU-Label für vollständig KI-generierte Inhalte, weil die Leitlinien der Europäischen Kommission KI-generierte Nachrichtenzusammenfassungen ausdrücklich als Anwendungsfall nennen. Sichtbare Kennzeichnungen und maschinenlesbare Herkunftsangaben unterstützen die Transparenz; die Verwendung des Symbols allein stellt jedoch keine Rechtskonformität fest und bedeutet nicht, dass MunichBrief den freiwilligen Verhaltenskodex unterzeichnet hat."

