[AccuracyOfficialInformation]
other = "Genauigkeit und offizielle Informationen"

[AccuracyOfficialInformationCopy]
other = "KI-generierte Zusammenfassungen und extrahierte Angaben können Fehler enthalten. Polizeimeldungen können nach ihrer Veröffentlichung aktualisiert werden. Maßgeblich sind die jeweils aktuellen offiziellen Informationen; es gilt die Unschuldsvermutung."

[PrivacyDataHandling]
other = "Datenschutz und Datenverarbeitung"

[PrivacyCopy]
other = "MunichBrief hat keine Konten, Analysefunktionen oder Werbung. Ein technisch notwendiges Cookie speichert die gewählte Sprache für ein Jahr. Nach „Verstanden“ merkt sich ein Erstanbieter-Präferenzcookie den KI-Hinweis 30 Tage lang. Das gewählte Farbschema wird lokal im Browser gespeichert."

[DataHandlingCopy]
other = "Extrahierte deutsche Quelltexte werden lokal gespeichert. Im eingeschränkten Prüfmodus können Originaltexte und Verarbeitungszustände zur Qualitätskontrolle angezeigt werden; der öffentliche Modus zeigt keine gespeicherten Originaltexte."

[IndependenceLegalReview]
other = "Unabhängigkeit und rechtliche Prüfung"

[IndependenceLegalReviewCopy]
other = "MunichBrief ist unabhängig von der Bayerischen Polizei. Technische Schutzmaßnahmen ersetzen keine rechtliche Prüfung. Aufbewahrung, Rechtsgrundlage, Daten zu Straftaten und anwendbare journalistische Ausnahmen erfordern eine fortlaufende Prüfung."

