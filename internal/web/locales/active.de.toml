[AIDisclosureCopy]
other = "MunichBrief nutzt lokal betriebene KI, um aus offiziellen Meldungen der Münchner Polizei Überschriften, Zusammenfassungen, Übersetzungen, Kategorien und strukturierte Angaben zu erstellen, etwa zum gemeldeten Ort und Zeitpunkt sowie dazu, ob die Polizei um Mithilfe bittet. KI-generierte oder abgeleitete Angaben können Fehler enthalten oder veralten, wenn die ursprüngliche Meldung aktualisiert wird. Jede Vorfallsseite nennt und verlinkt ihre offizielle polizeiliche Quelle; maßgeblich sind die dort veröffentlichten Informationen. MunichBrief ist ein unabhängiges Projekt und steht in keiner Verbindung zur Bayerischen Polizei. Für alle genannten Personen gilt die Unschuldsvermutung, solange ihre Schuld nicht rechtskräftig festgestellt wurde."

[AIDisclosurePreferenceCopy]
other = "Mit „Verstanden“ wird dieser Hinweis 30 Tage lang ausgeblendet."

