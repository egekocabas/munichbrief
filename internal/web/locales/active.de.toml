[SourcePolicy]
other = "Quellenregeln"

[SourcePolicyCopy]
other = "Neue Dokumente werden ausschließlich über den RSS-Feed der Münchner Polizei gefunden. Sammelmeldungen werden an ihren offiziellen Nummern getrennt; einzeln veröffentlichte Berichte bleiben einzeln."

[SourceAuthorityCopy]
other = "Die verlinkte Polizeimeldung ist maßgeblich, kann später geändert werden und stellt keine Schuld fest. Die Unschuldsvermutung gilt."

[ProcessingRetention]
other = "Verarbeitung und Aufbewahrung"

[ProcessingCopy]
other = "Extrahierter deutscher Text wird derzeit ohne automatische Löschfrist lokal gespeichert. Eine spätere Aufbewahrungsregel bleibt ausdrücklich vorbehalten."

[AICopy]
other = "Lokale KI-Modelle extrahieren zuerst strukturierte Metadaten, erstellen danach eine datensparsame deutsche Darstellung und übersetzen diese anschließend ins Englische. Metadatenbezeichnungen werden von der Anwendung lokalisiert."

[VisibilityCopy]
other = "Im eingeschränkten Prüfmodus sind Originaltexte und Verarbeitungszustände zur Qualitätskontrolle sichtbar. Der öffentliche Modus zeigt ausschließlich freigegebene KI-Texte und nie gespeicherte Originaltexte."

[PrivacyIndependence]
other = "Datenschutz und Unabhängigkeit"

[PrivacyCopy]
other = "Es gibt keine Konten, Analyse oder Werbung. Ein technisch notwendiges Sprachpräferenz-Cookie speichert ausschließlich Deutsch oder Englisch für ein Jahr."

[LegalCopy]
other = "Technische Schutzmaßnahmen ersetzen keine rechtliche Prüfung. Vor einer öffentlichen Bereitstellung müssen Rechtsgrundlage, Daten zu Straftaten, journalistische Ausnahmen und Aufbewahrung geprüft werden."
