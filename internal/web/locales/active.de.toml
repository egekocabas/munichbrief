[AccuracyOfficialInformation]
other = "Genauigkeit und offizielle Informationen"

[AccuracyOfficialInformationCopy]
other = "KI-generierte Zusammenfassungen und extrahierte Angaben können Fehler enthalten. Polizeimeldungen können nach ihrer Veröffentlichung aktualisiert werden. Maßgeblich sind die jeweils aktuellen offiziellen Informationen; es gilt die Unschuldsvermutung."

[PrivacyDataHandling]
other = "Datenschutz und Datenverarbeitung"

[PrivacyCopy]
other = "Es gibt weder Benutzerkonten noch Werbung. Dieser Browser merkt sich die Sprache ein Jahr lang, geschlossene KI-Hinweise und angewendete Suchen jeweils 30 Tage. Suchkriterien werden in einem eigenen Cookie übertragen. Das Farbschema bleibt bis zum Löschen im Browserspeicher. Die gewählte Sortierung der Meldungen wird für 30 Tage in einem Cookie dieser Website gespeichert. Die gewählten Suchfilter stehen in der URL, sodass du die Suche teilen kannst."

[DataHandlingCopy]
other = "Die deutschen Quelltexte werden zur Verarbeitung und für interne Prüfungen mit beschränktem Zugriff gespeichert. Öffentlich zu sehen sind die daraus erstellten Zusammenfassungen."

