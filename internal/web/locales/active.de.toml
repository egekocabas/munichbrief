other = "Lokale KI fasst offizielle Meldungen der Münchner Polizei zusammen, kategorisiert und übersetzt sie. Sie kann Fehler machen; Meldungen können nachträglich geändert werden. Prüfen Sie wichtige Angaben in der offiziellen Quelle. MunichBrief ist unabhängig von der Bayerischen Polizei; es gilt die Unschuldsvermutung."

