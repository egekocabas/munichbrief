[PrivacyRights]
other = "Ihre Rechte und Beschwerden"

[PrivacyControllerCopy]
other = "Ege Kocabaş betreibt MunichBrief als Privatperson von Bayern aus. Die oben genannte Anschrift dient der Korrespondenz. Fragen zur Verarbeitung Ihrer personenbezogenen Daten können Sie dorthin oder an die angegebene E-Mail-Adresse richten."

[PrivacyHostingCopy]
other = "Website, Datenbank und sämtliche KI-Verarbeitung laufen auf eigener Hardware des Betreibers in Deutschland. Zusammenfassungen, Übersetzungen und nachträgliche Prüfungen erfolgen lokal. Quellenmaterial wird nicht an externe KI-Anbieter übermittelt."

[PrivacyCloudflareCopy]
other = "Cloudflare stellt die Website bereit und schützt sie. Dabei werden Verbindungsdaten einschließlich IP-Adressen verarbeitet; auch netzwerkseitige Zugriffsstatistiken sind möglich. Web Analytics ist so eingestellt, dass Besucher aus der EU ausgeschlossen werden und das Messskript andernorts automatisch eingefügt wird. Sicherheitsvorgaben des Browsers können seine Ausführung verhindern. Davon unabhängig verarbeitet Cloudflare Daten zur Bereitstellung und Sicherheit. Zaraz Consent Management und Google Tag Gateway sind inaktiv. Grundlage für Bereitstellung und Schutz ist unser berechtigtes Interesse am sicheren Betrieb (Art. 6 Abs. 1 lit. f DSGVO). Die unten verlinkten Anbieterinformationen erläutern auch internationale Übermittlungen."

[PrivacyPreferencesCopy]
other = "Ein Erstanbieter-Cookie speichert die Sprache ein Jahr und die Bestätigung des KI-Hinweises 30 Tage. Die zuletzt angewandten Suchkriterien bleiben 30 Tage in einem HttpOnly-Cookie; beim Zurücksetzen werden sie entfernt. Das Farbschema bleibt bis zum Löschen im lokalen Browserspeicher. Die Rückkehrposition zur Liste wird für den aktuellen Browser-Tab gespeichert. Sicherheitstoken des Kontaktformulars gelten höchstens eine Stunde, Empfangsbestätigungen fünf Minuten; sie enthalten keinen Nachrichtentext. Diese Funktionen unterstützen den gewünschten Dienst (§25 Abs. 2 Nr. 2 TDDDG; Art. 6 Abs. 1 lit. f DSGVO). HTMX legt keine Seitenkopien im localStorage ab. Die gewählte Sortierung der Meldungen wird für 30 Tage in einem Cookie dieser Website gespeichert. Suchbegriffe und Filter stehen in der Seiten-URL und können in geteilten Links und im Browserverlauf gespeichert bleiben."

[PrivacyMonitoringCopy]
other = "Für einen zuverlässigen Betrieb erfassen technische Protokolle Methode, Pfad ohne Suchparameter, Status, Dauer und Kennungen einer Anfrage. Nachrichten, E-Mail-Adressen, Cookies und Besucher-IP-Adressen werden nicht in Anwendungsprotokollen erfasst. Für Prometheus-Metriken und Loki-Protokolle sind 30 Tage Aufbewahrung konfiguriert; Grafana dient der internen Anzeige. Zur Begrenzung von Kontaktversuchen speichern wir einen Zähler und eine aus der IP-Adresse abgeleitete pseudonyme Kennung ausschließlich im Arbeitsspeicher, nicht die ursprüngliche IP-Adresse. Das Limit gilt 15 Minuten ab dem ersten Versuch. Abgelaufene Zähler werden beim nächsten Kontaktversuch oder beim Neustart der Anwendung entfernt; ohne weiteren Versuch können sie länger im Arbeitsspeicher bleiben. Grundlage ist das berechtigte Interesse an Sicherheit und Zuverlässigkeit (Art. 6 Abs. 1 lit. f DSGVO). Cloudflares Aufbewahrung richtet sich nach eigenen Regeln."

[PrivacyCorrespondenceCopy]
other = "Bei einer Kontaktaufnahme verarbeiten wir E-Mail-Adresse, Thema und Nachricht zur Beantwortung Ihrer Anfrage (Art. 6 Abs. 1 lit. f DSGVO), gegebenenfalls zur Erfüllung gesetzlicher Pflichten (lit. c). Das Formular speichert die Nachricht zuerst in einem geschützten Datenbank-Postfach. SMTP2GO benachrichtigt contact@munichbrief.de; Cloudflare Email Routing leitet an ein Gmail-Postfach weiter. Antworten werden in Apple Mail geschrieben und über SMTP2GO versendet. Nachrichten werden nicht durch KI verarbeitet. Die verlinkten Anbieterinformationen erläutern auch Verarbeitungen außerhalb des EWR."

[PrivacyRetentionCopy]
other = "Nachrichten im Admin-Postfach werden 90 Tage nach Kennzeichnung als erledigt automatisch gelöscht. Beim Wiederöffnen entfällt diese Frist. Offene Anfragen werden überprüft und so lange aufbewahrt, wie sie benötigt werden. Für laufende Streitfälle oder gesetzliche Pflichten kann die Löschung mit dokumentiertem Grund und Prüftermin ausgesetzt werden. Gmail-Kopien und versendete Antworten werden gesondert geprüft und gelöscht. Für Versanddaten der Anbieter gelten eigene Fristen."

[PrivacyPostCopy]
other = "COCENTER / anschrift.net nimmt Briefe an der Korrespondenzanschrift entgegen, öffnet und scannt sie zur Bearbeitung durch den Betreiber. Grundlage sind berechtigte Interessen an der Korrespondenz oder gesetzliche Pflichten (Art. 6 Abs. 1 lit. f bzw. c DSGVO). Nach Angaben des Anbieters werden Originale sechs Monate aufbewahrt; Scans verbleiben bis zur Kontoschließung oder einer Löschanfrage, vorbehaltlich berechtigter Aufbewahrung. Einzelheiten enthält dessen Datenschutzerklärung."

[PrivacySourcesCopy]
other = "Grundlage der Zusammenfassungen sind öffentliche Mitteilungen des Polizeipräsidiums München. Deutscher Quelltext und RSS-Textstände werden für die Verarbeitung, die Prüfung von Änderungen und eine eingeschränkte Qualitätskontrolle aufbewahrt. Für diese Daten besteht derzeit keine feste Löschfrist. Öffentlich erscheinen Zusammenfassungen statt gespeicherter Originale. Berichte können auch ohne Namen Angaben enthalten, durch die Personen erkennbar werden. Bitte kontaktieren Sie uns, wenn ein Bericht Sie betrifft oder einen Fehler enthält. Berichtigungs- und Datenschutzanfragen prüfen wir im Einzelfall."

[PrivacyRightsCopy]
other = "Je nach anwendbaren Vorschriften bestehen Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung, Widerspruch gegen interessenbasierte Verarbeitung und gegebenenfalls Datenübertragbarkeit. Ein Konto ist zur Kontaktaufnahme nicht erforderlich. DSGVO-Anträge beantworten wir grundsätzlich innerhalb eines Monats; gesetzliche Ausnahmen und redaktionelle Regeln können das Ergebnis beeinflussen. Für Datenschutz im nichtöffentlichen Bereich in Bayern können Sie sich an das BayLDA oder eine andere zuständige Aufsichtsbehörde wenden. Für redaktionelle Beschwerden können andere Regeln gelten."

[ImpressumTitleDescription]
other = "Angaben zum Betreiber und Kontaktmöglichkeiten für MunichBrief."

[PrivacyTitleDescription]
other = "Wie MunichBrief Website-Daten, Korrespondenz und öffentliche Quellen verarbeitet."

[ImpressumResponsibleCopy]
other = "Der oben genannte Betreiber ist auch für redaktionelle Inhalte nach §18 Abs. 2 MStV verantwortlich. MunichBrief ist von der Polizei unabhängig."

[ImpressumContactCopy]
other = "Anfragen und Korrekturhinweise können Sie per E-Mail oder Kontaktformular senden. Die Anschrift dient dem Briefverkehr."

[ContactStorage]
other = "Ihre Nachricht wird in einem geschützten Posteingang gespeichert, bevor wir den Eingang bestätigen. Erledigte Anfragen werden dort nach 90 Tagen gelöscht."

[ContactClosed]
other = "Das Kontaktformular wurde geschlossen. Ihre Nachricht wurde nicht gesendet. Bitte schreiben Sie stattdessen an contact@munichbrief.de."

[ContactKeepDraft]
other = "Sie können Ihre Angaben unten in eine E-Mail kopieren. Dieser Entwurf wurde nicht im Posteingang gespeichert."

[PrivacyRequired]
other = "Welche Angaben Sie machen möchten"

[PrivacyRequiredCopy]
other = "Sie können MunichBrief ohne Konto lesen und müssen uns nicht kontaktieren. Es besteht keine gesetzliche oder vertragliche Pflicht, das Kontaktformular zu nutzen. Für eine Anfrage über das Formular benötigen wir Ihre E-Mail-Adresse, ein Thema und eine Nachricht, damit wir Ihr Anliegen bearbeiten und antworten können. Ohne diese Angaben lässt sich das Formular nicht absenden. Alternativ können Sie uns eine E-Mail schreiben. Bitte geben Sie nur die für Ihr Anliegen nötigen personenbezogenen Informationen an."

[PrivacySourcePeople]
other = "In Berichten erwähnte Personen"

[PrivacySourcePeopleCopy]
other = "Informationen über Beteiligte stammen aus öffentlichen Polizeimeldungen, nicht unmittelbar von diesen Personen. Je nach Meldung können sie Personenbeschreibungen, die Rolle im Geschehen, mutmaßliche Straftaten, Verletzungen sowie Ort und Zeit eines Vorfalls umfassen. Veröffentlichte Zusammenfassungen sind für alle zugänglich und können von Suchmaschinen erfasst werden. Kontaktanfragen und der private Posteingang werden nicht veröffentlicht."

[PrivacyAutomation]
other = "KI und automatisierte Entscheidungen"

[PrivacyAutomationCopy]
other = "KI erfasst, fasst zusammen, übersetzt und prüft Vorfallsberichte. Wir verwenden sie nicht für Entscheidungen über Besucherinnen und Besucher, die rechtliche oder ähnlich erhebliche Auswirkungen im Sinne von Artikel 22 DSGVO haben. Automatische Sicherheitsprüfungen können das Absenden des Kontaktformulars vorübergehend verhindern; per E-Mail bleiben wir erreichbar."

[PrivacyObjection]
other = "Ihr Widerspruchsrecht"

[PrivacyObjectionCopy]
other = "Soweit Artikel 21 DSGVO gilt, können Sie einer Verarbeitung auf Grundlage berechtigter Interessen jederzeit aus Gründen widersprechen, die sich aus Ihrer besonderen Situation ergeben. Richten Sie Ihren Widerspruch an die oben genannte Kontaktadresse. Wir stellen diese Verarbeitung ein, sofern wir keine zwingenden schutzwürdigen Gründe nachweisen können, die überwiegen, oder die Verarbeitung zur Geltendmachung, Ausübung oder Verteidigung von Rechtsansprüchen benötigen."

[LegalLastUpdated]
other = "Zuletzt aktualisiert"

[ImpressumRequests]
other = "Anliegen zu einer Meldung"

[ImpressumRequestsCopy]
other = "Wenn Sie von einer Meldung betroffen sind, können Sie sich wegen einer Berichtigung, Entfernung oder Gegendarstellung an den oben genannten Betreiber wenden. Bitte nennen Sie den Seitenlink und die betreffende Textstelle. Soweit das Gesetz ein schriftliches, unterzeichnetes Verlangen voraussetzt, nutzen Sie bitte die Postanschrift; das Kontaktformular allein erfüllt diese Formvorgabe nicht."

