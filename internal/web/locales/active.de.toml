[AboutIntro]
other = "MunichBrief macht lokale Polizeimeldungen in deiner Sprache zugänglich. Lies eine kurze Zusammenfassung, erfahre Ort und Zeit des Geschehens und öffne die Originalmeldung für weitere Einzelheiten."

