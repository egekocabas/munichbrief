[AIComparisonRecommendation]
other = "Die Europäische Kommission nennt KI-generierte Nachrichtenzusammenfassungen ausdrücklich als Anwendungsfall für das Label „vollständig KI-generiert“. Hier werden ausschließlich dessen vier offizielle Darstellungsvarianten verglichen."

