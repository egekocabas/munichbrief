[PrivacyControllerCopy]
other = "Ege Kocabaş gestisce MunichBrief a titolo personale dalla Baviera. L’indirizzo sopra è destinato alla corrispondenza. Puoi usarlo, oppure scrivere all’email indicata, per domande sul trattamento dei tuoi dati."

[PrivacyHostingCopy]
other = "Il sito, il database e tutti i processi di IA funzionano su hardware dell’operatore in Germania. Riassunti, traduzioni e controlli successivi avvengono localmente; le fonti non vengono inviate a fornitori esterni di IA."

[PrivacyCloudflareCopy]
other = "Cloudflare distribuisce e protegge il sito, trattando dati di connessione, compresi gli indirizzi IP, e può produrre statistiche sulla propria rete. Web Analytics esclude i visitatori dell’UE e inserisce automaticamente uno script di misurazione altrove; le restrizioni di sicurezza del browser possono impedirne l’esecuzione. La distribuzione e la sicurezza restano trattamenti distinti. Zaraz Consent Management e Google Tag Gateway sono inattivi. Distribuzione e protezione si basano sul legittimo interesse alla sicurezza del sito (art. 6(1)(f) GDPR). Le informative dei fornitori spiegano i trasferimenti internazionali."

[PrivacyPreferencesCopy]
other = "I cookie del sito conservano la lingua per un anno, la conferma dell’avviso IA per 30 giorni e l’ultima ricerca in un cookie HttpOnly per 30 giorni. Cancellare la ricerca rimuove i criteri. Il tema resta nella memoria locale fino alla cancellazione; la posizione di ritorno all’elenco dura per la sessione della scheda. I token del modulo scadono entro un’ora e le conferme entro cinque minuti, senza contenere messaggi. Queste funzioni servono il servizio richiesto (§25(2)(2) TDDDG; art. 6(1)(f) GDPR). HTMX non salva copie delle pagine in localStorage. L’ordine di visualizzazione scelto viene ricordato per 30 giorni in un cookie di questo sito."

[PrivacyMonitoringCopy]
other = "I log tecnici registrano metodo, percorso senza parametri di ricerca, stato, durata e identificativi delle richieste. Non registrano messaggi, email, cookie o IP dei visitatori. Prometheus e Loki sono configurati per una conservazione di 30 giorni; Grafana mostra i dati internamente. Per limitare i tentativi di contatto, conserviamo un contatore e un identificativo pseudonimo derivato dall’IP soltanto nella memoria dell’applicazione, senza salvare l’indirizzo IP originale. Il limite vale per 15 minuti dal primo tentativo. I contatori scaduti vengono eliminati al tentativo di contatto successivo o al riavvio dell’applicazione; in assenza di altri tentativi possono rimanere in memoria più a lungo. La finalità è sicurezza e affidabilità (art. 6(1)(f) GDPR). Cloudflare applica tempi propri."

[PrivacyCorrespondenceCopy]
other = "Email, argomento e messaggio servono a rispondere alla richiesta (art. 6(1)(f) GDPR), o ad adempiere obblighi legali applicabili (art. 6(1)(c)). Il modulo salva prima il messaggio in una casella privata nel database. SMTP2GO invia la notifica a contact@munichbrief.de e Cloudflare Email Routing la inoltra a Gmail. Le risposte si scrivono in Apple Mail e partono tramite SMTP2GO. I messaggi non vengono trattati dall’IA. Le informative spiegano anche i trattamenti fuori dal SEE; l’API europea di SMTP2GO non rende europea l’intera catena email. Le notifiche email possono essere disattivate. I messaggi ricevuti mentre sono disattivate restano nella casella privata e non vengono inviati automaticamente via email in seguito."

[PrivacyRetentionCopy]
other = "I messaggi della casella amministrativa vengono cancellati 90 giorni dopo la chiusura della richiesta. Riaprirla annulla la scadenza. Le richieste aperte vengono riesaminate e conservate finché necessario. Controversie o obblighi legali possono giustificare una sospensione della cancellazione, con motivo e data di riesame registrati. Copie Gmail e risposte inviate vengono controllate e cancellate separatamente; il sito non le elimina. I fornitori applicano i propri tempi ai dati di invio."

[PrivacyPostCopy]
other = "COCENTER / anschrift.net riceve, apre e scansiona le lettere affinché l’operatore possa occuparsene. Il trattamento risponde al legittimo interesse alla corrispondenza o a obblighi legali (art. 6(1)(f) o (c) GDPR). Il fornitore dichiara di conservare gli originali sei mesi e le scansioni fino alla chiusura dell’account o alla richiesta di cancellazione, salvo motivi giustificati di conservazione. I dettagli sono nella sua informativa."

[PrivacySourcesCopy]
other = "I riassunti derivano dai comunicati pubblici del Polizeipräsidium München. Testi tedeschi e copie testuali RSS restano disponibili per elaborazione, confronto delle modifiche e revisione riservata, senza cancellazione automatica configurata. Le pagine pubbliche mostrano riassunti, non gli originali conservati. L’assenza di nomi non garantisce l’anonimato. Si applicano le norme pertinenti sulla stampa e sui dati personali, comprese quelle sulle informazioni relative a reati. Le richieste di correzione e privacy vengono valutate individualmente."

[PrivacyRightsCopy]
other = "Secondo le norme applicabili puoi chiedere accesso, rettifica, cancellazione, limitazione e, ove prevista, portabilità, oppure opporti al trattamento basato sul legittimo interesse. Non serve un account. Le richieste di esercizio dei diritti GDPR ricevono normalmente risposta entro un mese; eccezioni legali e regole editoriali possono influire sull’esito. Per il settore non pubblico in Baviera puoi rivolgerti al BayLDA o a un’altra autorità competente. I reclami editoriali possono seguire regole diverse."

[ImpressumTitleDescription]
other = "Dati del responsabile e contatti di MunichBrief."

[PrivacyTitleDescription]
other = "Come MunichBrief tratta i dati del sito, la corrispondenza e le fonti pubbliche."

[ImpressumResponsibleCopy]
other = "L’operatore indicato è anche responsabile dei contenuti editoriali ai sensi del §18(2) MStV. MunichBrief è indipendente dalla polizia."

[ImpressumContactCopy]
other = "Per richieste e correzioni usa l’email o il modulo. L’indirizzo indicato è destinato alla corrispondenza postale."

[ContactStorage]
other = "Il messaggio viene salvato in una casella privata prima della conferma di ricezione. I messaggi segnati come risolti vengono eliminati dalla casella dopo 90 giorni."

[ContactClosed]
other = "Il modulo di contatto è stato chiuso. Il messaggio non è stato inviato. Scrivi a contact@munichbrief.de."

[ContactKeepDraft]
other = "Puoi copiare i dati qui sotto in un’email. Questa bozza non è stata salvata nella casella di posta."

[PrivacyRequired]
other = "Quali dati fornire"

[PrivacyRequiredCopy]
other = "Puoi leggere MunichBrief senza un account e senza contattarci. Non hai alcun obbligo legale o contrattuale di usare il modulo di contatto. Per inviarlo servono il tuo indirizzo email, un argomento e un messaggio, così da poter gestire la richiesta e risponderti. Senza questi campi non è possibile inviare il modulo. In alternativa puoi scriverci direttamente via email. Includi solo i dati personali necessari per la tua richiesta."

[PrivacySourcePeople]
other = "Persone menzionate nei resoconti"

[PrivacySourcePeopleCopy]
other = "Le informazioni sulle persone coinvolte negli episodi provengono dai comunicati pubblici della polizia, non direttamente dalle persone interessate. A seconda del comunicato, possono comprendere descrizioni delle persone, il loro coinvolgimento, presunti reati, lesioni, luogo e ora dell’episodio. Le sintesi pubblicate sono accessibili a chiunque e possono essere indicizzate dai motori di ricerca. I messaggi di contatto e la casella privata non vengono pubblicati."

[PrivacyAutomation]
other = "IA e decisioni automatizzate"

[PrivacyAutomationCopy]
other = "L’IA estrae informazioni, riassume, traduce e verifica i resoconti degli episodi. Non la usiamo per prendere decisioni sui visitatori con effetti giuridici o analogamente significativi ai sensi dell’articolo 22 GDPR. I controlli automatici di sicurezza possono bloccare temporaneamente l’invio del modulo; resta possibile contattarci via email."

[PrivacyObjection]
other = "Il diritto di opposizione"

[PrivacyObjectionCopy]
other = "Quando si applica l’articolo 21 GDPR, puoi opporti in qualsiasi momento al trattamento basato su interessi legittimi per motivi connessi alla tua situazione particolare. Invia l’opposizione al recapito indicato sopra. Interromperemo il trattamento, salvo dimostrare motivi legittimi cogenti che prevalgano sui tuoi diritti o la necessità di accertare, esercitare o difendere un diritto in sede giudiziaria."

[LegalLastUpdated]
other = "Ultimo aggiornamento"

[ImpressumRequests]
other = "Richieste relative a un resoconto"

[ImpressumRequestsCopy]
other = "Se un resoconto ti riguarda, puoi contattare il responsabile indicato sopra per chiedere una correzione, la rimozione o la pubblicazione di una replica. Indica il link alla pagina e il passaggio interessato. Quando la legge richiede una richiesta scritta e firmata, usa l’indirizzo postale: il solo modulo di contatto non soddisfa tale requisito."

