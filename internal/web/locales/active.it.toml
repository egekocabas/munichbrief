AIDisclosureCopy = { other = "MunichBrief usa AI eseguita localmente per creare titoli, riepiloghi, traduzioni, categorie e dettagli strutturati, come il luogo e l’ora segnalati e l’eventuale richiesta di aiuto al pubblico, a partire dai comunicati ufficiali della Polizia di Monaco. Le informazioni generate o dedotte dall’AI possono contenere errori o diventare obsolete se il comunicato originale viene aggiornato. Ogni pagina dell’evento identifica e collega la fonte ufficiale della polizia; consulta tale fonte per le informazioni autorevoli. MunichBrief è un progetto indipendente e non è affiliato alla Polizia bavarese. Ogni persona menzionata è presunta innocente fino a prova contraria." }
