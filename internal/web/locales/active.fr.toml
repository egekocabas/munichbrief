MonitoringCopy = { other = "Cloudflare assure la diffusion et la protection du site et traite des données de trafic, dont les adresses IP. Aucun script d’analyse dans le navigateur n’a été observé lors de notre contrôle. Le suivi interne enregistre des métriques agrégées et des journaux comprenant méthode, chemin, statut, durée et identifiants des requêtes. Leur conservation est configurée à 30 jours ; cela ne définit pas les durées de Cloudflare. Cloudflare peut aussi produire des statistiques de trafic sans script de mesure dans le navigateur." }

CoverageCopy = { other = "Cette sélection de communiqués de police ne constitue ni un relevé exhaustif des faits locaux ni une statistique de la criminalité. Les mises à jour peuvent apparaître avec un décalage sur MunichBrief. Les dates et heures proviennent de la source ; même une heure précisée peut être approximative." }
