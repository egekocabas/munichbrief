[PrivacyControllerCopy]
other = "Ege Kocabaş exploite MunichBrief à titre individuel depuis la Bavière, en Allemagne. L’adresse ci-dessus sert à la correspondance. Vous pouvez y écrire, ou utiliser l’e-mail indiqué, pour toute question sur vos données personnelles."

[PrivacyHostingCopy]
other = "Le site, la base de données et tous les traitements d’IA fonctionnent sur le matériel de l’exploitant en Allemagne. Les sources ne sont pas transmises à un fournisseur d’IA externe."

[PrivacyCloudflareCopy]
other = "Cloudflare assure la diffusion et la protection du site et traite notamment les adresses IP. Il peut produire des statistiques sur son réseau. Web Analytics est configuré pour exclure les visiteurs de l’UE et insérer automatiquement un script de mesure ailleurs; les règles de sécurité du navigateur peuvent en empêcher l’exécution. Le traitement lié à la diffusion et à la sécurité reste distinct. Zaraz Consent Management et Google Tag Gateway sont inactifs. La diffusion et la protection répondent à notre intérêt légitime à sécuriser le site (art. 6(1)(f) RGPD). Les politiques des fournisseurs précisent les transferts internationaux."

[PrivacyPreferencesCopy]
other = "Les cookies internes conservent la langue un an, la confirmation de l’information sur l’IA 30 jours et la dernière recherche 30 jours dans un cookie HttpOnly. Effacer la recherche supprime ces critères. Le thème reste dans le stockage local jusqu’à sa suppression; la position de retour à la liste reste dans l’onglet. Les jetons du formulaire expirent après une heure au plus, les confirmations de réception après cinq minutes; ils ne contiennent aucun message. Ces fonctions servent le service demandé (§25(2)(2) TDDDG; art. 6(1)(f) RGPD). HTMX ne conserve pas de copies de pages dans localStorage. L’ordre d’affichage choisi est conservé pendant 30 jours dans un cookie propre à ce site. Les termes de recherche et les filtres figurent dans l’adresse de la page et peuvent rester dans les liens partagés et l’historique du navigateur."

[PrivacyMonitoringCopy]
other = "Les journaux techniques enregistrent méthode, chemin sans paramètres de recherche, statut, durée et identifiants des requêtes. Ils ne contiennent ni messages, ni adresses e-mail, ni cookies, ni IP des visiteurs. Prometheus et Loki sont configurés pour conserver leurs données 30 jours; Grafana sert à leur consultation interne. Pour limiter les tentatives de contact, nous conservons un compteur et un identifiant pseudonyme dérivé de l’IP uniquement dans la mémoire de l’application, sans enregistrer l’adresse IP d’origine. La limite s’applique pendant 15 minutes à partir de la première tentative. Les compteurs expirés sont supprimés à la prochaine tentative de contact ou au redémarrage de l’application ; sans nouvelle tentative, ils peuvent rester en mémoire plus longtemps. Ces mesures répondent à un intérêt légitime de sécurité et de fiabilité (art. 6(1)(f) RGPD). Cloudflare applique ses propres durées."

[PrivacyCorrespondenceCopy]
other = "Votre adresse e-mail, l’objet choisi et le message servent à traiter votre demande (art. 6(1)(f) RGPD), ou une obligation légale applicable (art. 6(1)(c)). Le formulaire enregistre d’abord le message dans une boîte privée de la base de données. SMTP2GO envoie une notification à contact@munichbrief.de, puis Cloudflare Email Routing la transmet à Gmail. Les réponses sont rédigées dans Apple Mail et envoyées par SMTP2GO. Aucun message ne passe par l’IA. Les politiques liées ci-dessous expliquent les traitements hors EEE."

[PrivacyRetentionCopy]
other = "Les messages de la boîte administrateur sont supprimés 90 jours après la clôture de la demande. Sa réouverture annule ce délai. Les demandes ouvertes sont réexaminées et conservées tant que nécessaire. Un litige ou une obligation légale peut justifier une conservation avec motif et date de réexamen. Les copies Gmail et les réponses envoyées sont examinées et supprimées séparément. Les fournisseurs appliquent leurs propres durées aux données d’envoi."

[PrivacyPostCopy]
other = "COCENTER / anschrift.net reçoit, ouvre et numérise le courrier à l’adresse indiquée pour que l’exploitant puisse le traiter. Ce traitement repose sur l’intérêt légitime à recevoir du courrier ou sur une obligation légale (art. 6(1)(f) ou (c) RGPD). Selon le fournisseur, les originaux restent six mois et les scans jusqu’à la fermeture du compte ou une demande de suppression, sous réserve d’une conservation justifiée. Voir sa politique de confidentialité."

[PrivacySourcesCopy]
other = "Les résumés proviennent des communiqués publics du Polizeipräsidium München. Les textes sources allemands et les instantanés textuels RSS sont conservés pour le traitement, le suivi des modifications et les vérifications à accès restreint. Aucun délai fixe de suppression n’est actuellement prévu pour ces données. Les pages publiques présentent les résumés, pas les originaux conservés. Même sans noms, les récits peuvent contenir des détails permettant d’identifier des personnes. Contactez-nous si un récit vous concerne ou contient une erreur. Les demandes de correction et de protection des données sont examinées individuellement."

[PrivacyRightsCopy]
other = "Selon les règles applicables, vous pouvez demander accès, rectification, effacement, limitation et, dans certains cas, portabilité, ou vous opposer à un traitement fondé sur l’intérêt légitime. Aucun compte n’est nécessaire. Les demandes d’exercice des droits RGPD reçoivent normalement une réponse sous un mois; des exceptions légales et règles éditoriales peuvent influer sur la décision. Pour le secteur non public en Bavière, vous pouvez saisir le BayLDA ou une autre autorité compétente. Les réclamations éditoriales peuvent relever de règles différentes."

