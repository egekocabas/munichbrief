AIDisclosureFixtureCopy = { other = "Aperçu local : cette page utilise du contenu de test synthétique." }
AIDisclosureCopy = { other = "MunichBrief utilise une IA exécutée localement pour créer des titres, des résumés, des traductions, des catégories et des informations structurées, comme la zone et l’heure signalées ainsi que l’existence d’une demande d’aide au public, à partir des communiqués officiels de la police de Munich. Les informations générées ou déduites par l’IA peuvent contenir des erreurs ou devenir obsolètes si le communiqué original est mis à jour. Chaque page d’incident identifie la source policière officielle et fournit un lien vers celle-ci ; consultez cette source pour obtenir les informations faisant autorité. MunichBrief est un projet indépendant et n’est pas affilié à la police bavaroise. Toute personne mentionnée est présumée innocente jusqu’à preuve de sa culpabilité." }
AIDisclosurePreferenceCopy = { other = "En sélectionnant « Compris », cet avis sera mémorisé pendant 30 jours." }
