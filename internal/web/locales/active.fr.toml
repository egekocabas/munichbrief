AITransparencyEU = { other = "Transparence de l’IA et orientations de l’UE" }
AITransparencyEUCopy = { other = "MunichBrief utilise le label européen de contenu entièrement généré par l’IA, car les orientations de la Commission européenne citent expressément les résumés d’actualité générés par l’IA comme cas d’usage. Les labels visibles et les informations de provenance lisibles par machine contribuent à la transparence, mais l’utilisation de l’icône ne suffit pas à établir la conformité juridique et ne signifie pas que MunichBrief a signé le code de bonnes pratiques volontaire." }
