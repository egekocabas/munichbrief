[PrivacyRequiredCopy]
other = "MunichBrief možete čitati bez računa i bez obraćanja nama. Nemate zakonsku ni ugovornu obvezu koristiti obrazac za kontakt. Za slanje obrasca potrebni su adresa e-pošte, tema i poruka kako bismo obradili upit i odgovorili vam. Bez tih podataka obrazac nije moguće poslati. Možete nam se javiti i izravno e-poštom. Navedite samo osobne podatke potrebne za vaš upit."

