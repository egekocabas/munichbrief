[PrivacySourcePeopleCopy]
other = "Podaci o osobama uključenima u događaje dolaze iz javnih policijskih priopćenja, a ne izravno od tih osoba. Ovisno o priopćenju, mogu obuhvaćati opise osoba, njihovu ulogu u događaju, navodna kaznena djela, ozljede te mjesto i vrijeme događaja. Objavljeni sažeci dostupni su svima i mogu se pojaviti u tražilicama. Poruke poslane putem kontakta i privatni pretinac ne objavljuju se."

