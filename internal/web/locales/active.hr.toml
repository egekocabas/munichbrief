[PrivacyObjectionCopy]
other = "Kada se primjenjuje članak 21. GDPR-a, u svakom trenutku možete prigovoriti obradi koja se temelji na legitimnim interesima zbog razloga povezanih s vašom posebnom situacijom. Prigovor pošaljite na gore navedenu adresu za kontakt. Tu ćemo obradu obustaviti osim ako dokažemo uvjerljive legitimne razloge koji prevladavaju nad vašim pravima ili je obrada potrebna za postavljanje, ostvarivanje ili obranu pravnih zahtjeva."

