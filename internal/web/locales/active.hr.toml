[PrivacyControllerCopy]
other = "Ege Kocabaş osobno vodi MunichBrief iz Bavarske. Gornja adresa služi za korespondenciju. Pitanja o obradi osobnih podataka možete poslati poštom ili na navedenu e-adresu."

[PrivacyHostingCopy]
other = "Web-stranica, baza podataka i svi postupci umjetne inteligencije rade na vlastitoj opremi voditelja u Njemačkoj. Sažeci, prijevodi i naknadne provjere obrađuju se lokalno; izvorni tekstovi ne šalju se vanjskom pružatelju umjetne inteligencije."

[PrivacyCloudflareCopy]
other = "Cloudflare omogućuje pristup stranici i štiti je, obrađujući podatke o vezi, uključujući IP-adrese. Može izrađivati i statistike na svojoj mreži. Web Analytics isključuje posjetitelje iz EU-a, a drugdje automatski umeće skriptu za mjerenje; sigurnosna pravila preglednika mogu spriječiti izvršavanje. Obrada za isporuku i sigurnost odvojena je od toga. Zaraz Consent Management i Google Tag Gateway nisu aktivni. Isporuka i zaštita temelje se na legitimnom interesu za siguran rad (čl. 6. st. 1. t. f GDPR-a). Pravila pružatelja objašnjavaju međunarodne prijenose."

[PrivacyPreferencesCopy]
other = "Vlastiti kolačići pamte jezik godinu dana, potvrdu obavijesti o umjetnoj inteligenciji 30 dana i posljednju pretragu 30 dana u HttpOnly kolačiću. Brisanje pretrage uklanja kriterije. Tema ostaje u lokalnoj pohrani dok je ne izbrišete; povratni položaj popisa traje do zatvaranja kartice. Sigurnosni tokeni obrasca vrijede najviše sat, a potvrde primitka pet minuta; ne sadrže poruku. Ove funkcije omogućuju traženu uslugu (§25(2)(2) TDDDG-a; čl. 6. st. 1. t. f GDPR-a). HTMX ne sprema kopije stranica u localStorage. Odabrani redoslijed prikaza pamti se 30 dana u kolačiću ove stranice."

[PrivacyMonitoringCopy]
other = "Tehnički zapisi sadrže metodu, putanju bez parametara pretrage, status, trajanje i identifikatore zahtjeva, ali ne poruke, e-adrese, kolačiće ni IP-adrese posjetitelja. Prometheus i Loki podešeni su na čuvanje 30 dana; Grafana prikazuje interne podatke. Za ograničavanje pokušaja kontakta čuvamo brojač i pseudonimnu oznaku izvedenu iz IP-adrese samo u memoriji aplikacije, bez pohrane izvorne IP-adrese. Ograničenje traje 15 minuta od prvog pokušaja. Istekli brojači uklanjaju se pri sljedećem pokušaju kontakta ili ponovnom pokretanju aplikacije; ako nema novih pokušaja, mogu ostati u memoriji dulje. Svrha je sigurnost i pouzdanost (čl. 6. st. 1. t. f GDPR-a). Cloudflare ima vlastite rokove."

[PrivacyCorrespondenceCopy]
other = "E-adresu, temu i poruku obrađujemo radi odgovora na upit (čl. 6. st. 1. t. f GDPR-a) ili primjenjive zakonske obveze (t. c). Obrazac prvo sprema poruku u privatni pretinac baze podataka. SMTP2GO šalje obavijest na contact@munichbrief.de, a Cloudflare Email Routing prosljeđuje je u Gmail. Odgovori se pišu u Apple Mailu i šalju preko SMTP2GO-a. Poruke se ne obrađuju umjetnom inteligencijom. Pravila pružatelja opisuju i obradu izvan EGP-a; europski API SMTP2GO-a ne ograničava cijeli lanac e-pošte na EU. Obavijesti e-poštom mogu se isključiti. Poruke primljene dok su isključene ostaju u privatnoj pristigloj pošti i neće se kasnije automatski slati e-poštom."

[PrivacyRetentionCopy]
other = "Poruke u administratorskom pretincu automatski se brišu 90 dana nakon označavanja upita riješenim. Ponovno otvaranje poništava rok. Otvoreni upiti pregledavaju se i čuvaju dok su potrebni. Spor ili zakonska obveza mogu opravdati zadržavanje uz zabilježen razlog i datum pregleda. Kopije u Gmailu i poslani odgovori pregledavaju se i brišu zasebno; stranica ih ne briše. Pružatelji imaju vlastite rokove za podatke o slanju."

[PrivacyPostCopy]
other = "COCENTER / anschrift.net prima, otvara i skenira pisma kako bi ih voditelj mogao obraditi. Osnova je legitimni interes za primanje korespondencije ili zakonska obveza (čl. 6. st. 1. t. f ili c GDPR-a). Prema pružatelju, izvornici se čuvaju šest mjeseci, a skenovi do zatvaranja računa ili zahtjeva za brisanje, osim ako postoji opravdan razlog za čuvanje. Pojedinosti su u njegovoj obavijesti o privatnosti."

[PrivacySourcesCopy]
other = "Sažeci nastaju iz javnih priopćenja Polizeipräsidium München. Njemački izvorni tekstovi i tekstualne RSS snimke čuvaju se za obradu, provjeru promjena i ograničeni pregled; automatsko brisanje nije postavljeno. Javnost vidi sažetke, ne pohranjene izvornike. Izostavljanje imena ne jamči anonimnost. Urednička obrada mora poštovati primjenjive propise o tisku i zaštiti podataka, uključujući posebna pravila za podatke o kaznenim djelima. Zahtjevi za ispravak ili privatnost razmatraju se pojedinačno."

[PrivacyRightsCopy]
other = "Ovisno o primjenjivim pravilima možete zatražiti pristup, ispravak, brisanje, ograničenje i, gdje je primjenjivo, prenosivost, ili prigovoriti obradi na temelju legitimnog interesa. Račun nije potreban. Na zahtjeve za ostvarivanje prava iz GDPR-a obično odgovaramo u roku od mjesec dana; zakonske iznimke i urednička pravila mogu utjecati na ishod. Za nejavni sektor u Bavarskoj možete se obratiti BayLDA-u ili drugom nadležnom tijelu. Uredničke pritužbe mogu slijediti drukčija pravila."

