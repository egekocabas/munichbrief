other = "Ege Kocabaş лично управляет MunichBrief из Баварии. Адрес выше предназначен для переписки. Вопросы об обработке персональных данных можно отправить почтой или на указанный электронный адрес."

[PrivacyHostingCopy]
other = "Сайт, база данных и все процессы ИИ работают на собственном оборудовании оператора в Германии. Сводки, переводы и последующие проверки выполняются локально; исходные материалы не передаются внешним поставщикам ИИ."

[PrivacyCloudflareCopy]
other = "Cloudflare обеспечивает доступ к сайту и защищает его, обрабатывая данные соединения, включая IP-адреса. Он также может составлять статистику в своей сети. Web Analytics настроен на исключение посетителей из ЕС и автоматическую вставку измерительного скрипта в остальных регионах; правила безопасности браузера могут блокировать выполнение. Обработка для доставки и защиты выполняется отдельно. Zaraz Consent Management и Google Tag Gateway неактивны. Доставка и защита основаны на законном интересе безопасной работы сайта (ст. 6(1)(f) GDPR). Политики поставщиков описывают международную передачу данных."

[PrivacyPreferencesCopy]
other = "Собственные cookie хранят язык один год, подтверждение уведомления об ИИ 30 дней и последние условия поиска 30 дней в HttpOnly cookie. Очистка поиска удаляет условия. Тема остаётся в локальном хранилище до удаления, а позиция возврата к списку — в текущей вкладке. Токены формы действуют не более часа, подтверждения получения — пяти минут; сообщений в них нет. Эти функции обеспечивают запрошенную услугу (§25(2)(2) TDDDG; ст. 6(1)(f) GDPR). HTMX не сохраняет копии страниц в localStorage."

[PrivacyMonitoringCopy]
other = "Технические журналы содержат метод, путь без параметров поиска, статус, длительность и идентификаторы запросов. Сообщения, электронные адреса, cookie и IP посетителей в них не записываются. Prometheus и Loki настроены на хранение 30 дней; Grafana показывает данные для внутреннего использования. Для ограничения попыток обращения мы храним счётчик и псевдонимный идентификатор, полученный из IP, только в памяти приложения, не сохраняя сам IP-адрес. Ограничение действует 15 минут с первой попытки. Истёкшие счётчики удаляются при следующей попытке обращения или перезапуске приложения; если новых попыток нет, они могут оставаться в памяти дольше. Цель — безопасность и надёжность (ст. 6(1)(f) GDPR). У Cloudflare собственные сроки."

[PrivacyCorrespondenceCopy]
other = "Электронный адрес, тему и сообщение обрабатываем для ответа на обращение (ст. 6(1)(f) GDPR) или выполнения применимой правовой обязанности (6(1)(c)). Форма сначала сохраняет сообщение в личном ящике базы данных. SMTP2GO отправляет уведомление на contact@munichbrief.de, а Cloudflare Email Routing пересылает его в Gmail. Ответы пишутся в Apple Mail и отправляются через SMTP2GO. Сообщения не обрабатываются ИИ. Политики поставщиков описывают обработку за пределами ЕЭЗ; европейский API SMTP2GO не ограничивает всю почтовую цепочку территорией ЕС. Уведомления по электронной почте можно отключить. Сообщения, полученные в это время, остаются в закрытом разделе входящих и не отправляются автоматически по почте позднее."

[PrivacyRetentionCopy]
other = "Сообщения в административном ящике автоматически удаляются через 90 дней после отметки об урегулировании обращения. Повторное открытие отменяет срок. Открытые обращения пересматриваются и хранятся, пока нужны. Текущий спор или правовая обязанность могут оправдывать дальнейшее хранение с записанной причиной и датой пересмотра. Копии Gmail и отправленные ответы проверяются и удаляются отдельно; сайт их не удаляет. Для записей поставщиков об отправке действуют собственные сроки."

[PrivacyPostCopy]
other = "COCENTER / anschrift.net получает, вскрывает и сканирует письма для обработки оператором. Основание — законный интерес в получении корреспонденции или правовая обязанность (ст. 6(1)(f) или (c) GDPR). По информации поставщика, бумажные оригиналы хранятся шесть месяцев, а сканы — до закрытия аккаунта или запроса на удаление, если дальнейшее хранение не обосновано. Подробности приведены в его политике конфиденциальности."

[PrivacySourcesCopy]
other = "Сводки создаются на основе публичных сообщений Polizeipräsidium München. Немецкие тексты и текстовые снимки RSS сохраняются для обработки, проверки изменений и ограниченного просмотра; автоматическое удаление пока не настроено. Публичные страницы показывают сводки, а не сохранённые оригиналы. Отсутствие имён не гарантирует анонимность. Редакционная обработка должна соблюдать применимые правила прессы и защиты данных, включая специальные нормы о сведениях, связанных с правонарушениями. Запросы на исправление и защиту данных рассматриваются индивидуально."

[PrivacyRightsCopy]
other = "В зависимости от применимых правил вы можете запросить доступ, исправление, удаление, ограничение и, где предусмотрено, переносимость данных, либо возразить против обработки на основе законного интереса. Аккаунт не нужен. На запросы об осуществлении прав GDPR обычно отвечаем в течение месяца; правовые исключения и редакционные правила могут влиять на результат. По вопросам непубличного сектора Баварии можно обратиться в BayLDA или иной компетентный орган. Для редакционных жалоб могут действовать другие правила."

