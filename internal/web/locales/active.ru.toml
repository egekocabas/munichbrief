other = "Сведения об операторе MunichBrief и способы связи."

[PrivacyTitleDescription]
other = "Как MunichBrief обрабатывает данные сайта, переписку и публичные источники."

[ImpressumResponsibleCopy]
other = "Указанный оператор также отвечает за редакционное содержание согласно §18(2) MStV. MunichBrief независим от полиции."

[ImpressumContactCopy]
other = "Вопросы и исправления отправляйте по электронной почте или через форму. Указанный адрес предназначен для почтовой переписки."

[ContactStorage]
