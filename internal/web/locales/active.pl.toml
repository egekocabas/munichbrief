AIDisclosureCopy = { other = "MunichBrief korzysta z lokalnie uruchamianej AI do tworzenia tytułów, podsumowań, tłumaczeń, kategorii i ustrukturyzowanych szczegółów, takich jak zgłoszone miejsce i czas oraz informacja, czy policja prosi o pomoc publiczną, na podstawie oficjalnych komunikatów policji w Monachium. Informacje wygenerowane lub wywnioskowane przez AI mogą zawierać błędy albo stać się nieaktualne po zmianie komunikatu źródłowego. Każda strona zdarzenia wskazuje oficjalne źródło policyjne i zawiera do niego odsyłacz; oficjalnych informacji należy szukać w tym źródle. MunichBrief jest niezależnym projektem i nie jest powiązany z policją bawarską. Każda wymieniona osoba jest uznawana za niewinną, dopóki jej wina nie zostanie udowodniona." }
