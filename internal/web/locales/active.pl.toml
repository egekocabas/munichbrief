[PrivacyHostingCopy]
other = "Strona, baza danych i wszystkie procesy AI działają na własnym sprzęcie operatora w Niemczech. Streszczenia, tłumaczenia i późniejsze weryfikacje powstają lokalnie; materiały źródłowe nie trafiają do zewnętrznego dostawcy AI."

[PrivacyCloudflareCopy]
other = "Cloudflare dostarcza i chroni stronę, przetwarzając dane połączenia, w tym adresy IP. Może też tworzyć statystyki w swojej sieci. Web Analytics wyklucza użytkowników z UE i automatycznie dodaje skrypt pomiarowy w innych regionach; zasady bezpieczeństwa przeglądarki mogą zablokować jego wykonanie. Obsługa dostarczania i bezpieczeństwa jest odrębna. Zaraz Consent Management oraz Google Tag Gateway są nieaktywne. Dostarczanie i ochrona wynikają z uzasadnionego interesu bezpiecznego prowadzenia strony (art. 6 ust. 1 lit. f RODO). Polityki dostawców opisują także transfery międzynarodowe."

[PrivacyPreferencesCopy]
other = "Własne pliki cookie zachowują język przez rok, potwierdzenie informacji o AI przez 30 dni oraz ostatnie kryteria wyszukiwania przez 30 dni w cookie HttpOnly. Wyczyszczenie wyszukiwania usuwa kryteria. Motyw pozostaje w pamięci lokalnej do usunięcia, a pozycja powrotu do listy w bieżącej karcie. Tokeny formularza wygasają najpóźniej po godzinie, potwierdzenia odbioru po pięciu minutach; nie zawierają wiadomości. Funkcje te służą żądanej usłudze (§25(2)(2) TDDDG; art. 6 ust. 1 lit. f RODO). HTMX nie zapisuje kopii stron w localStorage."

[PrivacyMonitoringCopy]
other = "Logi techniczne obejmują metodę, ścieżkę bez parametrów zapytania, status, czas trwania i identyfikatory żądań. Nie zapisują wiadomości, adresów e-mail, cookie ani IP odwiedzających. Prometheus i Loki mają ustawiony okres 30 dni; Grafana prezentuje dane wewnętrznie. Krótkotrwałe pseudonimowe liczniki oparte na IP ograniczają próby kontaktu przez 15 minut. Celem jest bezpieczeństwo i niezawodność (art. 6 ust. 1 lit. f RODO). Cloudflare ma odrębne okresy przechowywania."

[PrivacyCorrespondenceCopy]
other = "Adres e-mail, temat i treść przetwarzamy w celu odpowiedzi (art. 6 ust. 1 lit. f RODO) lub wykonania obowiązku prawnego, gdy ma zastosowanie (lit. c). Formularz najpierw zapisuje wiadomość w prywatnej skrzynce bazy danych. SMTP2GO wysyła powiadomienie na contact@munichbrief.de, a Cloudflare Email Routing przekazuje je do Gmaila. Odpowiedzi powstają w Apple Mail i są wysyłane przez SMTP2GO. Wiadomości nie są przetwarzane przez AI. Polityki dostawców opisują także przetwarzanie poza EOG; europejski interfejs API SMTP2GO nie ogranicza całej drogi poczty do UE."

[PrivacyRetentionCopy]
other = "Wiadomości w skrzynce administracyjnej są usuwane po 90 dniach od oznaczenia sprawy jako rozwiązanej. Ponowne otwarcie anuluje termin. Otwarte sprawy są przeglądane i przechowywane tak długo, jak to potrzebne. Spór lub obowiązek prawny może uzasadniać dalsze przechowywanie z odnotowanym powodem i datą przeglądu. Kopie Gmail i wysłane odpowiedzi są przeglądane i usuwane osobno; strona ich nie usuwa. Dane dotyczące wysyłki podlegają okresom dostawców."

[PrivacyPostCopy]
other = "COCENTER / anschrift.net odbiera, otwiera i skanuje listy, aby operator mógł się nimi zająć. Podstawą jest uzasadniony interes w odbiorze korespondencji lub obowiązek prawny (art. 6 ust. 1 lit. f lub c RODO). Według dostawcy oryginały są przechowywane sześć miesięcy, a skany do zamknięcia konta lub żądania usunięcia, z zastrzeżeniem uzasadnionego dalszego przechowywania. Szczegóły opisuje jego polityka prywatności."

[PrivacySourcesCopy]
other = "Streszczenia powstają na podstawie publicznych komunikatów Polizeipräsidium München. Niemieckie teksty i tekstowe kopie RSS są zachowywane do przetwarzania, kontroli zmian i ograniczonego przeglądu; nie skonfigurowano automatycznego usuwania. Publiczne strony pokazują streszczenia, a nie zachowane oryginały. Brak nazwisk nie gwarantuje anonimowości. Przetwarzanie redakcyjne musi uwzględniać właściwe przepisy prasowe i ochrony danych, w tym szczególne zasady dotyczące informacji o przestępstwach. Wnioski o sprostowanie lub ochronę prywatności rozpatrujemy indywidualnie."

[PrivacyRightsCopy]
other = "Zależnie od właściwych przepisów możesz żądać dostępu, sprostowania, usunięcia, ograniczenia oraz, gdy ma zastosowanie, przenoszenia danych albo sprzeciwić się przetwarzaniu opartemu na uzasadnionym interesie. Konto nie jest potrzebne. Na wnioski dotyczące praw RODO odpowiadamy zwykle w ciągu miesiąca; wyjątki prawne i zasady redakcyjne mogą wpływać na wynik. W sprawach sektora niepublicznego w Bawarii można złożyć skargę do BayLDA lub innego właściwego organu. Skargi redakcyjne mogą podlegać innym zasadom."

