MonitoringCopy = { other = "Cloudflare dostarcza i chroni witrynę oraz przetwarza dane o ruchu, w tym adresy IP. Podczas sprawdzania nie zaobserwowano skryptu analitycznego w przeglądarce. Wewnętrzny monitoring zapisuje zbiorcze metryki i dzienniki z metodą, ścieżką, statusem, czasem trwania oraz identyfikatorami żądań. Ich okres przechowywania ustawiono na 30 dni; nie określa to okresów stosowanych przez Cloudflare. Cloudflare może też tworzyć statystyki ruchu bez skryptu analitycznego w przeglądarce." }

CoverageCopy = { other = "To wybór opublikowanych komunikatów policji, a nie pełny rejestr lokalnych zdarzeń ani statystyka przestępczości. Aktualizacje mogą pojawiać się w MunichBrief z opóźnieniem. Daty i godziny pochodzą ze źródła; podana godzina również może być przybliżona." }
