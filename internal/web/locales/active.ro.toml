[PrivacyRights]
other = "Drepturile tale și reclamații"

[PrivacyControllerCopy]
other = "Ege Kocabaş administrează MunichBrief în nume propriu, din Bavaria, Germania. Adresa de mai sus este pentru corespondență. Poți scrie acolo sau la adresa de e-mail indicată pentru întrebări despre datele tale personale."

[PrivacyHostingCopy]
other = "Site-ul, baza de date și toate procesele de IA rulează pe echipamentele proprii ale operatorului, în Germania. Sursele nu sunt trimise unui furnizor extern de IA."

[PrivacyCloudflareCopy]
other = "Cloudflare livrează și protejează site-ul, prelucrează date de conexiune, inclusiv adrese IP, și poate genera statistici în propria rețea. Web Analytics exclude vizitatorii din UE și inserează automat un script de măsurare în alte regiuni; restricțiile de securitate ale browserului pot împiedica rularea lui. Livrarea și securitatea sunt prelucrări distincte. Zaraz Consent Management și Google Tag Gateway sunt inactive. Livrarea și protecția se bazează pe interesul legitim de a opera un site sigur (art. 6(1)(f) GDPR). Politicile furnizorilor explică transferurile internaționale."

[PrivacyPreferencesCopy]
other = "Cookie-urile proprii păstrează limba un an, confirmarea informării despre IA 30 de zile și ultima căutare 30 de zile într-un cookie HttpOnly. Ștergerea căutării elimină criteriile. Tema rămâne în stocarea locală până la ștergere; poziția de revenire în listă se păstrează pentru fila curentă. Tokenurile formularului expiră în cel mult o oră, iar confirmările în cinci minute; nu conțin mesaje. Aceste funcții asigură serviciul solicitat (§25(2)(2) TDDDG; art. 6(1)(f) GDPR). HTMX nu păstrează copii ale paginilor în localStorage. Ordinea de afișare aleasă este păstrată timp de 30 de zile într-un cookie al acestui site. Termenii de căutare și filtrele apar în adresa paginii și pot rămâne în linkurile distribuite și în istoricul browserului."

[PrivacyMonitoringCopy]
other = "Jurnalele tehnice înregistrează metoda, calea fără parametrii căutării, starea, durata și identificatorii cererilor. Nu înregistrează mesaje, e-mailuri, cookie-uri sau IP-urile vizitatorilor. Prometheus și Loki sunt configurate pentru păstrarea datelor 30 de zile; Grafana le afișează intern. Pentru a limita încercările de contact, păstrăm un contor și un identificator pseudonim derivat din IP doar în memoria aplicației, fără a salva adresa IP originală. Limita se aplică timp de 15 minute de la prima încercare. Contoarele expirate sunt șterse la următoarea încercare de contact sau la repornirea aplicației; dacă nu mai există încercări, pot rămâne în memorie mai mult timp. Scopul este securitatea și fiabilitatea (art. 6(1)(f) GDPR). Cloudflare are termene proprii."

[PrivacyCorrespondenceCopy]
other = "Prelucrăm adresa de e-mail, subiectul și mesajul pentru a răspunde solicitării (art. 6(1)(f) GDPR) sau pentru obligații legale aplicabile (art. 6(1)(c)). Formularul salvează întâi mesajul într-o căsuță privată din baza de date. SMTP2GO trimite notificarea la contact@munichbrief.de, iar Cloudflare Email Routing o redirecționează către Gmail. Răspunsurile sunt scrise în Apple Mail și trimise prin SMTP2GO. Mesajele nu sunt procesate de IA. Politicile furnizorilor descriu și prelucrarea în afara SEE."

[PrivacyRetentionCopy]
other = "Mesajele din căsuța de administrare se șterg automat la 90 de zile după marcarea solicitării ca rezolvată. Redeschiderea anulează termenul. Solicitările deschise sunt revizuite și păstrate cât este necesar. Un litigiu sau o obligație legală poate justifica păstrarea cu motiv și dată de revizuire înregistrate. Copiile Gmail și răspunsurile trimise sunt revizuite și șterse separat. Furnizorii aplică propriile termene datelor de expediere."

[PrivacyPostCopy]
other = "COCENTER / anschrift.net primește, deschide și scanează scrisorile pentru a putea fi gestionate de operator. Temeiul este interesul legitim privind corespondența sau o obligație legală (art. 6(1)(f) ori (c) GDPR). Potrivit furnizorului, originalele sunt păstrate șase luni, iar scanările până la închiderea contului sau la o cerere de ștergere, cu excepția unei păstrări justificate. Detaliile se află în politica sa de confidențialitate."

[PrivacySourcesCopy]
other = "Rezumatele provin din comunicatele publice ale Polizeipräsidium München. Textele sursă în germană și copiile textuale RSS sunt păstrate pentru procesare, verificarea modificărilor și verificări cu acces restricționat. În prezent nu există un termen fix de ștergere pentru aceste date. Paginile publice afișează rezumate, nu originalele stocate. Contactează-ne dacă o relatare te privește sau conține o eroare. Cererile de corectare și de protecție a datelor sunt evaluate individual."

[PrivacyRightsCopy]
other = "În funcție de normele aplicabile poți solicita acces, rectificare, ștergere, restricționare și, unde se aplică, portabilitate, sau te poți opune prelucrării bazate pe interes legitim. Nu ai nevoie de cont. Cererile privind drepturile GDPR primesc de regulă răspuns într-o lună; excepțiile legale și normele editoriale pot influența rezultatul. Pentru sectorul nepublic din Bavaria te poți adresa BayLDA sau altei autorități competente. Reclamațiile editoriale pot urma reguli diferite."

