[PrivacyRequiredCopy]
other = "Poți citi MunichBrief fără cont și fără să ne contactezi. Nu ai nicio obligație legală sau contractuală să folosești formularul de contact. Pentru a-l trimite, avem nevoie de adresa ta de e-mail, un subiect și un mesaj, ca să putem analiza solicitarea și să îți răspundem. Fără aceste câmpuri, formularul nu poate fi trimis. Ne poți scrie și direct prin e-mail. Include doar datele personale necesare pentru solicitarea ta."

[PrivacySourcePeople]
other = "Persoane menționate în relatări"

[PrivacySourcePeopleCopy]
other = "Informațiile despre persoanele implicate în incidente provin din comunicatele publice ale poliției, nu direct de la aceste persoane. În funcție de comunicat, pot include descrieri ale persoanelor, rolul lor în incident, presupuse infracțiuni, răni, locul și ora incidentului. Rezumatele publicate sunt accesibile oricui și pot fi indexate de motoarele de căutare. Mesajele de contact și conținutul căsuței private nu sunt publicate."

