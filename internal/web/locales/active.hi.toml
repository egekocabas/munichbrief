[LicensesIntro]
other = "MunichBrief का अपना कोड MIT लाइसेंस के तहत उपलब्ध है। तीसरे पक्ष के घटकों और स्रोत सामग्री पर उनकी अपनी शर्तें लागू रहती हैं।"

[LicensesOriginal]
other = "लाइसेंस के पाठ और कॉपीराइट सूचनाएँ उनकी मूल भाषा में दी गई हैं।"

[LicensesModelIntro]
other = "यह जानकारी MunichBrief के लिए जाँचे गए मॉडलों की शर्तें बताती है। यह अभी इस्तेमाल हो रहे मॉडलों की सूची नहीं है; हर रिपोर्ट में उसके AI प्रसंस्करण की जानकारी अलग से बनी रहती है। मॉडल का लाइसेंस अपने आप उससे बने सारांश पर लागू नहीं होता।"

[LicensesIconChanges]
other = "AI आइकन: © यूरोपीय संघ। MunichBrief ने हल्के रंग वाले संस्करण में धूसर पृष्ठभूमि और किनारा जोड़ा है। गहरे रंग वाला संस्करण मूल चित्र का उपयोग करता है। इन आइकनों के इस्तेमाल का अर्थ यूरोपीय संघ का समर्थन नहीं है।"

[LicensesDataChanges]
other = "भौगोलिक डेटा को म्यूनिख और आसपास के क्षेत्र तक सीमित किया जाता है। स्थानों का मिलान करने के लिए उनके नाम एक समान प्रारूप में रखे जाते हैं। मूल डेटासेट दिए गए लिंक पर उपलब्ध हैं। पुलिस की विज्ञप्तियाँ अलग स्रोत सामग्री हैं और उन पर MunichBrief का MIT लाइसेंस लागू नहीं होता।"

