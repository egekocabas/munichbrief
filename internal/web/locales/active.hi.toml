[PrivacyControllerCopy]
other = "Ege Kocabaş बवेरिया से व्यक्तिगत रूप से MunichBrief चलाते हैं। ऊपर दिया पता पत्राचार के लिए है। निजी डेटा के बारे में सवाल डाक या दिए गए ईमेल पते पर भेज सकते हैं।"

[PrivacyHostingCopy]
other = "वेबसाइट, डेटाबेस और एआई के सभी काम संचालक के जर्मनी स्थित अपने उपकरणों पर चलते हैं। सारांश, अनुवाद और बाद की जाँच स्थानीय रूप से होती है; स्रोत सामग्री किसी बाहरी एआई सेवा को नहीं भेजी जाती।"

[PrivacyCloudflareCopy]
other = "Cloudflare साइट उपलब्ध कराता और सुरक्षित रखता है। वह IP पतों सहित कनेक्शन डेटा संसाधित करता है और अपने नेटवर्क पर ट्रैफ़िक आँकड़े बना सकता है। Web Analytics में यूरोपीय संघ के आगंतुक शामिल नहीं हैं; अन्य क्षेत्रों में मापन स्क्रिप्ट अपने-आप जोड़ी जाती है। ब्राउज़र की सुरक्षा पाबंदियाँ उसे चलने से रोक सकती हैं। साइट उपलब्ध कराने और सुरक्षा का प्रसंस्करण इससे अलग है। Zaraz Consent Management और Google Tag Gateway निष्क्रिय हैं। उपलब्धता और सुरक्षा का आधार सुरक्षित संचालन का वैध हित है (GDPR अनुच्छेद 6(1)(f))। प्रदाताओं की नीतियाँ अंतरराष्ट्रीय डेटा हस्तांतरण भी समझाती हैं।"

[PrivacyPreferencesCopy]
other = "हमारे अपने कुकी भाषा एक साल, एआई सूचना की पुष्टि 30 दिन और आखिरी खोज के मानदंड HttpOnly कुकी में 30 दिन रखते हैं। खोज साफ़ करने पर मानदंड मिट जाते हैं। थीम स्थानीय ब्राउज़र संग्रह में मिटाए जाने तक रहती है; सूची पर लौटने की स्थिति वर्तमान टैब तक रहती है। फ़ॉर्म सुरक्षा टोकन अधिकतम एक घंटे और प्राप्ति की पुष्टि पाँच मिनट में समाप्त होते हैं; उनमें संदेश नहीं होता। ये सुविधाएँ आपके माँगे हुए सेवा-कार्य के लिए हैं (TDDDG §25(2)(2); GDPR अनुच्छेद 6(1)(f))। HTMX, localStorage में पेज की प्रतियाँ नहीं रखता। रिपोर्ट दिखाने का आपका चुना हुआ क्रम इस वेबसाइट की कुकी में 30 दिनों तक सहेजा जाता है। खोज के शब्द और फ़िल्टर पेज के पते में दिखाई देते हैं और साझा किए गए लिंक तथा ब्राउज़र के इतिहास में रह सकते हैं।"

[PrivacyMonitoringCopy]
other = "तकनीकी लॉग में अनुरोध विधि, खोज पैरामीटर रहित पथ, स्थिति, अवधि और अनुरोध पहचान दर्ज होते हैं। संदेश, ईमेल पते, कुकी या आगंतुकों के IP पते नहीं लिखे जाते। Prometheus और Loki के आँकड़ों व लॉग के लिए 30 दिन की अवधि निर्धारित है; Grafana इन्हें आंतरिक रूप से दिखाता है। संपर्क की कोशिशों को सीमित करने के लिए हम मूल IP पता सहेजे बिना, उससे बना छद्मनाम वाला पहचानकर्ता और एक काउंटर केवल एप्लिकेशन की मेमोरी में रखते हैं। सीमा पहली कोशिश से 15 मिनट तक लागू रहती है। अवधि पूरी होने के बाद काउंटर अगली संपर्क कोशिश या एप्लिकेशन के दोबारा शुरू होने पर हटते हैं; कोई नई कोशिश न हो तो वे मेमोरी में अधिक समय तक रह सकते हैं। उद्देश्य सुरक्षा और विश्वसनीयता है (GDPR अनुच्छेद 6(1)(f))। Cloudflare की अपनी अवधि है।"

[PrivacyCorrespondenceCopy]
other = "आपके ईमेल पते, विषय और संदेश का उपयोग सवाल का जवाब देने के लिए होता है (GDPR अनुच्छेद 6(1)(f)), या लागू कानूनी दायित्व निभाने के लिए (6(1)(c))। फ़ॉर्म पहले संदेश को डेटाबेस के निजी इनबॉक्स में सहेजता है। SMTP2GO, contact@munichbrief.de पर सूचना भेजता है; Cloudflare Email Routing उसे Gmail में पहुँचाता है। जवाब Apple Mail में लिखकर SMTP2GO से भेजे जाते हैं। संदेश एआई को नहीं भेजे जाते। नीचे दी नीतियाँ EEA के बाहर प्रसंस्करण भी बताती हैं।"

[PrivacyRetentionCopy]
other = "एडमिन इनबॉक्स के संदेश, मामला हल हुआ चिह्नित करने के 90 दिन बाद अपने-आप मिटते हैं। दोबारा खोलने पर यह समय-सीमा रद्द हो जाती है। खुले मामलों की समीक्षा होती है और ज़रूरत तक रखा जाता है। जारी विवाद या कानूनी दायित्व के लिए कारण और समीक्षा तारीख दर्ज करके संदेश रखा जा सकता है। Gmail की प्रतियाँ और भेजे गए जवाब अलग से जाँचकर मिटाए जाते हैं। प्रदाताओं के भेजने संबंधी रिकॉर्ड पर उनकी अपनी अवधि लागू होती है।"

[PrivacyPostCopy]
other = "COCENTER / anschrift.net पत्राचार पते पर आए पत्र प्राप्त करता, खोलता और स्कैन करता है ताकि संचालक उन्हें देख सके। आधार पत्राचार पाने का वैध हित या कानूनी दायित्व है (GDPR अनुच्छेद 6(1)(f) या (c))। प्रदाता के अनुसार काग़ज़ी मूल छह महीने और स्कैन खाता बंद होने या मिटाने का अनुरोध होने तक रहते हैं, जब तक रखने का उचित कारण न हो। विवरण उसकी निजता नीति में है।"

[PrivacySourcesCopy]
other = "सारांश Polizeipräsidium München की सार्वजनिक विज्ञप्तियों पर आधारित हैं। जर्मन स्रोत पाठ और RSS पाठ की प्रतियाँ प्रसंस्करण, बदलावों की जाँच और सीमित पहुँच वाली समीक्षा के लिए रखी जाती हैं। इन रिकॉर्ड को मिटाने की कोई निश्चित समय-सीमा अभी तय नहीं है। सार्वजनिक पेज सारांश दिखाते हैं, सहेजे गए मूल पाठ नहीं। नाम न होने पर भी रिपोर्ट में ऐसे विवरण हो सकते हैं जिनसे किसी व्यक्ति की पहचान हो जाए। कोई रिपोर्ट आपसे संबंधित हो या उसमें गलती हो, तो कृपया हमसे संपर्क करें। सुधार और निजता से जुड़े हर अनुरोध की अलग से समीक्षा की जाती है।"

[PrivacyRightsCopy]
other = "लागू नियमों के अनुसार आप डेटा देखने, सुधारने, मिटाने, प्रसंस्करण सीमित करने, जहाँ लागू हो डेटा हस्तांतरण पाने या वैध हित पर आधारित प्रसंस्करण का विरोध करने का अनुरोध कर सकते हैं। खाता बनाना ज़रूरी नहीं। GDPR अधिकारों के अनुरोधों का जवाब सामान्यतः एक महीने में मिलता है; कानूनी अपवाद और संपादकीय नियम परिणाम बदल सकते हैं। बवेरिया के गैर-सार्वजनिक क्षेत्र के डेटा सुरक्षा मामलों में BayLDA या अन्य सक्षम प्राधिकरण से शिकायत कर सकते हैं। संपादकीय शिकायतों के नियम अलग हो सकते हैं।"

[ImpressumTitleDescription]
other = "MunichBrief के संचालक और संपर्क की जानकारी।"

[PrivacyTitleDescription]
other = "MunichBrief वेबसाइट डेटा, पत्राचार और सार्वजनिक स्रोतों को कैसे संभालता है।"

[ImpressumResponsibleCopy]
other = "ऊपर दिए संचालक MStV §18(2) के तहत संपादकीय सामग्री के भी ज़िम्मेदार हैं। MunichBrief पुलिस से स्वतंत्र है।"

[ImpressumContactCopy]
other = "सवाल और सुधार ईमेल या संपर्क फ़ॉर्म से भेजें। दिया गया पता डाक से पत्राचार के लिए है।"

[ContactStorage]
other = "प्राप्ति की पुष्टि करने से पहले आपका संदेश एक निजी इनबॉक्स में सहेजा जाता है। हल हो चुके के रूप में चिह्नित संदेश उस इनबॉक्स से 90 दिन बाद हटा दिए जाते हैं।"

[ContactClosed]
other = "संपर्क फ़ॉर्म बंद कर दिया गया है। आपका संदेश नहीं भेजा गया। कृपया contact@munichbrief.de पर ईमेल करें।"

[ContactKeepDraft]
other = "आप नीचे दी गई जानकारी कॉपी करके ईमेल में डाल सकते हैं। यह ड्राफ़्ट इनबॉक्स में सहेजा नहीं गया है।"

[PrivacyRequired]
other = "कौन-सी जानकारी देना ज़रूरी है"

[PrivacyRequiredCopy]
other = "आप बिना खाता बनाए या हमसे संपर्क किए MunichBrief पढ़ सकते हैं। संपर्क फ़ॉर्म इस्तेमाल करना आपकी कोई कानूनी या अनुबंध संबंधी बाध्यता नहीं है। फ़ॉर्म भेजने के लिए ईमेल पता, विषय और संदेश देना ज़रूरी है, ताकि हम आपकी बात समझकर जवाब दे सकें। इनके बिना फ़ॉर्म जमा नहीं होगा। आप हमें सीधे ईमेल भी कर सकते हैं। कृपया अपने अनुरोध के लिए ज़रूरी निजी जानकारी ही दें।"

[PrivacySourcePeople]
other = "रिपोर्ट में उल्लिखित लोग"

[PrivacySourcePeopleCopy]
other = "घटनाओं से जुड़े लोगों की जानकारी पुलिस की सार्वजनिक विज्ञप्तियों से मिलती है, सीधे उन लोगों से नहीं। विज्ञप्ति के अनुसार इसमें लोगों का विवरण, घटना में उनकी भूमिका, कथित अपराध, चोटें और घटना की जगह व समय शामिल हो सकते हैं। प्रकाशित सारांश सभी के लिए उपलब्ध हैं और खोज इंजन उन्हें अपनी सूची में शामिल कर सकते हैं। संपर्क संदेश और निजी इनबॉक्स की सामग्री प्रकाशित नहीं की जाती।"

[PrivacyAutomation]
other = "एआई और स्वचालित निर्णय"

[PrivacyAutomationCopy]
other = "एआई घटना की रिपोर्ट से जानकारी निकालता है, सारांश बनाता है, अनुवाद करता है और जाँच करता है। हम इसका इस्तेमाल आगंतुकों के बारे में ऐसे निर्णय लेने के लिए नहीं करते जिनका GDPR के अनुच्छेद 22 के तहत कानूनी या वैसा ही महत्वपूर्ण प्रभाव हो। स्वचालित सुरक्षा जाँच फ़ॉर्म भेजने पर अस्थायी रोक लगा सकती है; तब भी आप हमें ईमेल कर सकते हैं।"

[PrivacyObjection]
other = "आपत्ति करने का अधिकार"

[PrivacyObjectionCopy]
other = "जहाँ GDPR का अनुच्छेद 21 लागू होता है, वहाँ आप अपनी विशेष परिस्थिति से जुड़े कारणों के आधार पर वैध हितों के लिए किए जा रहे डेटा प्रसंस्करण पर किसी भी समय आपत्ति कर सकते हैं। अपनी आपत्ति ऊपर दिए संपर्क पते पर भेजें। हम संबंधित प्रसंस्करण रोक देंगे, जब तक हम आपके अधिकारों से अधिक महत्वपूर्ण बाध्यकारी वैध कारण सिद्ध न कर सकें या कानूनी दावे स्थापित करने, उनका प्रयोग करने या बचाव करने के लिए यह आवश्यक न हो।"

[LegalLastUpdated]
other = "आखिरी बार अपडेट किया गया"

[ImpressumRequests]
other = "किसी रिपोर्ट के बारे में अनुरोध"

[ImpressumRequestsCopy]
other = "यदि कोई रिपोर्ट आपसे संबंधित है, तो आप सुधार, हटाने या अपना प्रत्युत्तर प्रकाशित करने के अनुरोध के लिए ऊपर दिए संपर्क विवरण से संचालक को लिख सकते हैं। कृपया पेज का लिंक और संबंधित अंश बताएं। जहाँ कानून के अनुसार हस्ताक्षर किया हुआ लिखित अनुरोध ज़रूरी हो, वहाँ डाक पते का इस्तेमाल करें; केवल संपर्क फ़ॉर्म भेजने से वह शर्त पूरी नहीं होती।"

