AIDisclosureCopy = { other = "MunichBrief स्थानीय रूप से संचालित AI का उपयोग करके म्यूनिख पुलिस की आधिकारिक विज्ञप्तियों से शीर्षक, सारांश, अनुवाद, श्रेणियाँ और संरचित विवरण तैयार करता है, जैसे बताया गया क्षेत्र और समय तथा क्या पुलिस जनता से सहायता माँग रही है। AI द्वारा तैयार या अनुमानित जानकारी में त्रुटियाँ हो सकती हैं या मूल विज्ञप्ति अपडेट होने पर वह पुरानी हो सकती है। प्रत्येक घटना पृष्ठ आधिकारिक पुलिस स्रोत की पहचान करता है और उसका लिंक देता है; प्रामाणिक जानकारी के लिए उसी स्रोत को देखें। MunichBrief एक स्वतंत्र परियोजना है और बवेरियन पुलिस से संबद्ध नहीं है। दोष सिद्ध होने तक उल्लेखित प्रत्येक व्यक्ति को निर्दोष माना जाता है।" }
