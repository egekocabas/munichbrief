VerifyTranslateCopy = { other = "अलग एआई जाँचें घटना की श्रेणी और पुलिस द्वारा जनता से मदद माँगे जाने की जानकारी दोबारा जाँचती हैं। इन्हें अनुवाद से पहले प्राथमिकता दी जाती है। हर भाषा का संस्करण उसका अनुवाद तैयार होने पर प्रकाशित होता है। सफल जाँचों के बाद प्रकाशित रिपोर्ट की श्रेणी और मदद की अपील के लेबल बदल सकते हैं।" }
