MonitoringCopy = { other = "हम साइट उपलब्ध कराने और उसकी सुरक्षा के लिए Cloudflare का इस्तेमाल करते हैं। Cloudflare आईपी पते समेत कनेक्शन से जुड़े डेटा को प्रोसेस करता है और ट्रैफ़िक के आँकड़े बना सकता है। साइट सुचारु रूप से चलती रहे, इसलिए हम अपने तकनीकी अनुरोध लॉग और कुल प्रदर्शन के आँकड़े 30 दिनों तक रखते हैं।" }

CoverageCopy = { other = "यह प्रकाशित पुलिस विज्ञप्तियों का संकलन है, सभी स्थानीय घटनाओं का पूरा रिकॉर्ड या अपराध के आँकड़े नहीं। अपडेट MunichBrief पर कुछ देर से आ सकते हैं। घटना की तारीख और समय मूल विज्ञप्ति से लिए जाते हैं; घड़ी का समय दिया होने पर भी वह अनुमानित हो सकता है।" }

