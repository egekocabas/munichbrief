ContactPoliceCopy = { other = "MunichBrief पुलिस से स्वतंत्र है। यहाँ पुलिस में शिकायत दर्ज नहीं की जा सकती और न ही आपात सहायता माँगी जा सकती है। पुलिस से जुड़े मामलों के लिए उसकी आधिकारिक वेबसाइट पर दिए संपर्क विवरण का उपयोग करें।" }
