[PrivacyControllerCopy]
other = "Ege Kocabaş gestiona MunichBrief a título personal desde Baviera, Alemania. La dirección anterior es para correspondencia. Puedes escribir allí o al correo indicado para consultar sobre tus datos personales."

[PrivacyHostingCopy]
other = "El sitio, la base de datos y todos los procesos de IA funcionan en equipos propios del responsable en Alemania. Las fuentes no se envían a servicios externos de IA."

[PrivacyCloudflareCopy]
other = "Cloudflare distribuye y protege el sitio y procesa datos de conexión, incluidas direcciones IP. También puede generar estadísticas en su red. Web Analytics está configurado para excluir visitantes de la UE e insertar automáticamente un script de medición en otras regiones; las restricciones del navegador pueden impedir su ejecución. Esto es independiente del procesamiento necesario para la distribución y seguridad. Zaraz Consent Management y Google Tag Gateway están inactivos. La distribución y protección responden a nuestro interés legítimo en operar un sitio seguro (art. 6(1)(f) RGPD). Las políticas enlazadas explican las transferencias internacionales."

[PrivacyPreferencesCopy]
other = "Las cookies propias guardan el idioma un año, la confirmación del aviso de IA 30 días y la última búsqueda 30 días en una cookie HttpOnly. Borrar la búsqueda elimina sus criterios. El tema permanece en el almacenamiento local hasta borrarlo; la posición de regreso a la lista se guarda durante la sesión de la pestaña. Los tokens del formulario duran como máximo una hora y las confirmaciones cinco minutos; no contienen mensajes. Estas funciones permiten prestar el servicio solicitado (§25(2)(2) TDDDG; art. 6(1)(f) RGPD). HTMX no guarda copias de páginas en localStorage. El orden de visualización que elijas se guarda durante 30 días en una cookie propia del sitio. Los términos de búsqueda y los filtros aparecen en la dirección de la página y pueden conservarse en los enlaces compartidos y en el historial del navegador."

[PrivacyMonitoringCopy]
other = "Los registros técnicos incluyen método, ruta sin parámetros de consulta, estado, duración e identificadores de solicitud. No registran mensajes, correos electrónicos, cookies ni IP de visitantes. Prometheus y Loki están configurados para conservar métricas y registros 30 días; Grafana los muestra internamente. Para limitar los intentos de contacto, guardamos un contador y un identificador seudónimo derivado de la IP solo en la memoria de la aplicación, sin almacenar la dirección IP original. El límite se aplica durante 15 minutos desde el primer intento. Los contadores caducados se eliminan con el siguiente intento de contacto o al reiniciar la aplicación; si no hay más intentos, pueden permanecer en memoria durante más tiempo. Su finalidad es la seguridad y fiabilidad (art. 6(1)(f) RGPD). Cloudflare tiene plazos propios."

[PrivacyCorrespondenceCopy]
other = "Tratamos tu correo, tema y mensaje para responder a la consulta (art. 6(1)(f) RGPD), o cumplir obligaciones legales cuando corresponda (art. 6(1)(c)). El formulario guarda primero el mensaje en un buzón privado de la base de datos. SMTP2GO envía una notificación a contact@munichbrief.de y Cloudflare Email Routing la reenvía a Gmail. Las respuestas se redactan en Apple Mail y se envían mediante SMTP2GO. No se usa IA para tratar los mensajes. Las políticas enlazadas describen el tratamiento fuera del EEE."

[PrivacyRetentionCopy]
other = "Los mensajes del buzón de administración se eliminan 90 días después de marcar la consulta como resuelta. Reabrirla cancela el plazo. Las consultas abiertas se revisan y conservan mientras sean necesarias. Un litigio u obligación legal puede justificar conservarlas con un motivo y fecha de revisión registrados. Las copias en Gmail y respuestas enviadas se revisan y eliminan por separado. Los proveedores aplican sus propios plazos a los registros de envío."

[PrivacyPostCopy]
other = "COCENTER / anschrift.net recibe, abre y escanea las cartas para que el responsable las gestione. La base es el interés legítimo en recibir correspondencia o una obligación legal (art. 6(1)(f) o (c) RGPD). Según el proveedor, guarda los originales seis meses y los escaneos hasta cerrar la cuenta o solicitar su eliminación, salvo conservación justificada. Su política explica los detalles."

[PrivacySourcesCopy]
other = "Los resúmenes se elaboran con comunicados públicos del Polizeipräsidium München. Los textos originales en alemán y las copias textuales RSS se conservan para procesarlos, detectar cambios y realizar revisiones de acceso restringido. Actualmente no hay un plazo fijo de eliminación para estos registros. Las páginas públicas muestran resúmenes, no los originales almacenados. Contacta con nosotros si un relato te afecta o contiene un error. Evaluamos individualmente las solicitudes de corrección y privacidad."

[PrivacyRightsCopy]
other = "Según las normas aplicables, puedes solicitar acceso, rectificación, supresión, limitación y, cuando proceda, portabilidad, u oponerte al tratamiento basado en intereses legítimos. No necesitas cuenta. Los derechos del RGPD se atienden normalmente en un mes; las excepciones legales y normas editoriales pueden afectar al resultado. Para protección de datos del sector no público en Baviera puedes reclamar ante BayLDA u otra autoridad competente. Las reclamaciones editoriales pueden seguir otras reglas."

