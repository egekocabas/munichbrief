AIDisclosureFixtureCopy = { other = "Vista previa local: esta página utiliza contenido de prueba sintético." }
AIDisclosureCopy = { other = "MunichBrief utiliza IA operada localmente para crear titulares, resúmenes, traducciones, categorías y datos estructurados, como la zona y la hora comunicadas y si la policía solicita colaboración ciudadana, a partir de comunicados oficiales de la Policía de Múnich. La información generada o inferida por IA puede contener errores o quedar desactualizada si se modifica el comunicado original. Cada página de incidente identifica y enlaza la fuente policial oficial; consulta esa fuente para obtener información autorizada. MunichBrief es un proyecto independiente y no está vinculado a la Policía de Baviera. Toda persona mencionada se presume inocente mientras no se demuestre su culpabilidad." }
