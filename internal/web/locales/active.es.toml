AITransparencyEU = { other = "Transparencia de la IA y orientaciones de la UE" }
AITransparencyEUCopy = { other = "MunichBrief utiliza la etiqueta de la UE para contenido íntegramente generado por IA porque las orientaciones de la Comisión Europea incluyen expresamente los resúmenes de noticias generados por IA como caso de uso. Las etiquetas visibles y la procedencia legible por máquinas favorecen la transparencia, pero el uso del icono no demuestra por sí solo el cumplimiento legal ni indica que MunichBrief haya firmado el Código de buenas prácticas voluntario." }
