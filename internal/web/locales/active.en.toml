other = "MunichBrief is not a police contact point. For police matters, use the contact details on the official police website."


[MonitoringCopy]
other = "We use Cloudflare to deliver and protect the site. Cloudflare processes connection data, including IP addresses, and can produce traffic statistics. To keep the site running reliably, we retain our own technical request logs and aggregate performance metrics for 30 days."

[CoverageCopy]
other = "This is a selection of published police reports, not a complete record of local incidents or a crime statistic. Updates may reach MunichBrief later. Incident dates and times reflect the source; a stated clock time may be approximate."

[VerifyTranslate]
other = "Check and translate in the background"

[VerifyTranslateCopy]
other = "Separate AI checks review the category and whether the police are asking for public assistance. These checks take priority over translation. Each language version appears when its translation is ready. Successful checks can update the category and public-assistance labels after publication."
