[PrivacyControllerCopy]
other = "Ege Kocabaş operates MunichBrief personally from Bavaria. The address above is the correspondence address. You can contact the controller there or by email about the processing of your personal data."

[PrivacyHostingCopy]
other = "The website, database and all AI processing run on the operator’s own hardware in Germany. German summaries, translations and subsequent checks are processed locally; source material is not sent to an external AI provider."

[PrivacyCloudflareCopy]
other = "Cloudflare delivers and protects the site, processing connection information including IP addresses. It can produce traffic statistics at its network edge. Cloudflare Web Analytics is configured to exclude EU visitors and automatically insert a performance-measurement script elsewhere. Browser security restrictions may prevent that script from running. This is separate from Cloudflare’s delivery and security processing. Zaraz consent management and Google Tag Gateway are inactive. Delivery and protection serve our legitimate interest in operating a secure website (Article 6(1)(f) GDPR). Provider policies linked below explain their processing and international transfers."

[PrivacyPreferencesCopy]
other = "We remember your language for one year and acknowledgement of the AI notice for 30 days in first-party cookies. The latest applied search is saved in an HttpOnly cookie for 30 days; clearing it removes those criteria. Your theme stays in local browser storage until cleared. Return-to-list position uses storage for the current browser tab. Contact security tokens expire within one hour and receipt confirmations within five minutes; neither contains your message. These preferences and security functions support the service you request (§25(2)(2) TDDDG; Article 6(1)(f) GDPR). HTMX does not save page snapshots in localStorage. Your preferred timeline order is remembered for 30 days in a first-party cookie. Search terms and filters appear in the page URL and may be retained in shared links and browser history."

[PrivacyMonitoringCopy]
other = "To operate the site reliably, technical logs record request method, path without query parameters, status, duration and request identifiers. Application logs do not record message contents, email addresses, cookies or visitor IP addresses. Prometheus metrics and Loki logs are configured for 30-day retention; Grafana displays this internal monitoring. To limit contact attempts, we keep a counter and an IP-derived pseudonymous identifier only in application memory, without saving the original IP address. The limit applies for 15 minutes from the first attempt. Expired counters are removed at the next contact attempt or when the application restarts; they can remain in memory longer if no further attempt occurs. These measures serve security and reliability (Article 6(1)(f) GDPR). Cloudflare’s own retention is separate."

[PrivacyCorrespondenceCopy]
other = "When you contact us, we process your email address, chosen topic and message to answer your enquiry (Article 6(1)(f) GDPR), or to meet a legal obligation where applicable (Article 6(1)(c)). The form first saves your message in a private database inbox. SMTP2GO sends a notification to contact@munichbrief.de; Cloudflare Email Routing forwards it to a Gmail mailbox. Replies are written in Apple Mail and sent through SMTP2GO. No message is sent to an AI service. The linked provider policies describe their data handling, including processing outside the EEA."

[PrivacyRetentionCopy]
other = "Admin inbox messages are deleted automatically 90 days after the enquiry is marked resolved. Reopening it cancels that deadline. Unresolved enquiries are reviewed and retained while needed. Correspondence needed for an ongoing dispute or legal obligation may be held with a recorded reason and review date. Gmail copies and sent replies are reviewed and deleted separately. Delivery-provider records follow their own retention policies, not the inbox’s 90-day period."

[PrivacyPostCopy]
other = "Letters addressed to the correspondence address are received, opened and scanned by COCENTER / anschrift.net so the operator can handle them. This serves our legitimate interest in receiving correspondence, or applicable legal obligations (Article 6(1)(f) or (c) GDPR). According to the provider, paper originals are kept for six months and scans remain until account closure or a deletion request, subject to justified retention. Its privacy notice explains the details."

[PrivacySourcesCopy]
other = "We use public releases from Polizeipräsidium München to produce local incident summaries. German source text and RSS text snapshots are retained for processing, source-change checks and restricted review. There is currently no fixed deletion period for these records. Public pages show summaries rather than stored originals. Reports may contain details that identify individuals, even without names. Please contact us if a report concerns you or contains an error; correction and privacy requests are assessed individually."

[PrivacyRightsCopy]
other = "Depending on the applicable rules, you may request access, correction, deletion or restriction, object to processing based on legitimate interests, and request portability where applicable. You can use the contact address without creating an account. Requests to exercise GDPR rights are normally answered within one month; lawful exceptions and editorial rules may affect the outcome. For ordinary non-public-sector data protection in Bavaria you may complain to BayLDA or another competent supervisory authority. Editorial complaints may follow different rules."

[ImpressumTitleDescription]
other = "Operator details and ways to contact MunichBrief."

[PrivacyTitleDescription]
other = "How MunichBrief handles website data, correspondence and public sources."

[ImpressumResponsibleCopy]
other = "The individual operator named above is also responsible for editorial content under §18(2) MStV. MunichBrief is independent of the police."

[ImpressumContactCopy]
other = "Please use email or the contact form for enquiries and corrections. The address is a postal correspondence address."

[ContactStorage]
other = "Your message is saved in a private inbox before we confirm receipt. Resolved messages are deleted from that inbox after 90 days."

[ContactClosed]
other = "The contact form has been closed. Your message was not sent. Please email contact@munichbrief.de instead."

[ContactKeepDraft]
other = "You can copy your details below into an email. This draft has not been saved in the inbox."

[PrivacyRequired]
other = "Choosing what to share"

[PrivacyRequiredCopy]
other = "You can read MunichBrief without an account or contacting us. There is no legal or contractual obligation to use the contact form. To submit it, we need your email address, a topic and a message so we can handle your enquiry and reply. Without these fields the form cannot be submitted. You can contact us by email instead. Please include only personal details needed for your enquiry."

[PrivacySourcePeople]
other = "People mentioned in reports"

[PrivacySourcePeopleCopy]
other = "Information about people involved in incidents comes from public police releases, not directly from those people. Depending on the release, it may include descriptions of people, their involvement, alleged offences, injuries, and the place and time of an incident. Published summaries are accessible to anyone and may be indexed by search engines. Contact messages and the private inbox are not published."

[PrivacyAutomation]
other = "AI and automated decisions"

[PrivacyAutomationCopy]
other = "AI extracts, summarizes, translates and checks incident reports. We do not use it to make decisions about visitors with legal or similarly significant effects under Article 22 GDPR. Automated security checks can temporarily block a contact submission; you can still contact us by email."

[PrivacyObjection]
other = "Your right to object"

[PrivacyObjectionCopy]
other = "Where Article 21 GDPR applies, you may object at any time to processing based on legitimate interests for reasons relating to your particular situation. Send your objection to the contact address above. We will stop that processing unless we can demonstrate overriding compelling legitimate grounds or need it to establish, exercise or defend legal claims."

[LegalLastUpdated]
other = "Last updated"

[ImpressumRequests]
other = "Requests concerning a report"

[ImpressumRequestsCopy]
other = "If a report affects you, you can contact the operator above to request a correction, removal or right of reply. Please include the page link and identify the passage concerned. Where a signed written request is legally required, use the postal address; the contact form alone does not meet that requirement."

