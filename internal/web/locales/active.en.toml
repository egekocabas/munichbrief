[PrivacyDataHandling]
other = "Privacy and data handling"

[PrivacyCopy]
other = "MunichBrief has no accounts, analytics, or advertising. A necessary cookie stores the selected language for one year. After you select “Got it”, a first-party preference cookie remembers the AI disclosure for 30 days. The selected colour theme is stored locally in your browser."

[DataHandlingCopy]
other = "Extracted German source text is stored locally. Restricted review mode can display originals and processing states for quality control; public mode does not display stored originals."

[IndependenceLegalReview]
other = "Independence and legal review"

[IndependenceLegalReviewCopy]
other = "MunichBrief is independent from the Bavarian Police. Technical safeguards do not replace legal review. Retention, lawful basis, offence-related data, and applicable journalistic exceptions require ongoing review."

