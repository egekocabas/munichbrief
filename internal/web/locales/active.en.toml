[AboutIntro]
other = "MunichBrief reorganizes official Munich Police press releases into readable incident cards. It is an independent, unofficial service."

[SourcePolicy]
other = "Source policy"

[SourcePolicyCopy]
other = "New documents are discovered only through the Munich Police RSS feed. Combined reports are split at their official numbers; separately published reports remain separate."

[SourceAuthorityCopy]
other = "The linked police release is authoritative, may later be amended, and does not establish guilt. The presumption of innocence applies."

[ProcessingRetention]
other = "Processing and retention"

[ProcessingCopy]
other = "Extracted German text is currently stored locally without an automated deletion deadline. A later retention policy is explicitly reserved."

[AICopy]
other = "One local-model request creates a data-minimised German and English presentation. Only output from the active model and prompt version is publishable."

[VisibilityCopy]
other = "Restricted review mode exposes originals and processing states for quality control. Public mode shows only approved AI text and never renders stored originals."

[PrivacyIndependence]
other = "Privacy and independence"

[PrivacyCopy]
other = "There are no accounts, analytics, or advertising. One necessary language-preference cookie stores only German or English for one year."

[LegalCopy]
other = "Engineering safeguards do not replace legal review. Lawful basis, offence-related data, journalistic exceptions, and retention must be reviewed before public launch."
