[PrivacyDataHandling]
other = "Privacy and data handling"

[PrivacyCopy]
other = "MunichBrief has no accounts, analytics, or advertising. A necessary cookie stores the selected language for one year. After you select “Got it”, a first-party preference cookie remembers the AI disclosure for 30 days. The selected colour theme is stored locally in your browser."

