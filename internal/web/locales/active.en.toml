[AboutIntro]
other = "MunichBrief helps you follow local police reports in your language. Read a short summary, see where and when an incident happened, and open the official report for the full details."

[FromReleaseToIncident]
other = "From release to incident"

[Discover]
other = "Discover"

[DiscoverCopy]
other = "New releases are discovered only through the official Munich Police RSS feed."

[Organize]
other = "Organize"

[OrganizeCopy]
other = "Releases containing multiple reports are split using their official report numbers. Separately published reports remain separate."

[Summarize]
other = "Summarize"

[SummarizeCopy]
other = "Local AI models extract details such as categories, locations, dates, and public-assistance requests, then create a data-minimized German summary."

[TranslatePublish]
other = "Publish in German"

[TranslatePublishCopy]
other = "The German summary appears as soon as it passes the initial automated checks. It does not have to wait for translations or later verification."

[AccuracyOfficialInformation]
other = "Accuracy and official information"

[AccuracyOfficialInformationCopy]
other = "AI-generated summaries and extracted details may contain errors. Police releases may be updated after publication. The latest official information remains authoritative, and the presumption of innocence applies."

[PrivacyDataHandling]
other = "Privacy and data handling"

[PrivacyCopy]
other = "No account is needed and there is no advertising. This browser remembers your language for one year, dismissed AI notices for 30 days, and applied searches for 30 days. Search criteria are sent in a first-party cookie. The colour theme stays in browser storage until removed."

[DataHandlingCopy]
other = "German source text is retained for processing and restricted review. Public pages show the resulting summaries."

[IndependenceLegalReview]
other = "Independence and legal review"

[IndependenceLegalReviewCopy]
other = "MunichBrief is independent from the Bavarian Police. Technical safeguards do not replace legal review. Retention, lawful basis, offence-related data, and applicable journalistic exceptions require ongoing review."

