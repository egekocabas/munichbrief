[PrivacyHostingCopy]
other = "Web sitesi, veritabanı ve tüm yapay zekâ işlemleri, işletmecinin Almanya’daki kendi donanımında çalışır. Özetler, çeviriler ve sonraki kontroller yerel olarak yapılır; kaynak metinler harici bir yapay zekâ sağlayıcısına gönderilmez."

[PrivacyCloudflareCopy]
other = "Cloudflare, siteyi ziyaretçilere sunmak ve korumak için IP adresleri dâhil bağlantı verilerini işler. Kendi ağı üzerinden ziyaret istatistikleri de oluşturabilir. Web Analytics ayarında AB’deki ziyaretçiler kapsam dışıdır; diğer bölgelerde performans ölçüm kodu otomatik eklenir. Tarayıcının güvenlik kuralları bu kodun çalışmasını engelleyebilir. Cloudflare’ın sitenin sunumu ve güvenliği için yaptığı işlemler bundan ayrıdır. Zaraz onay yönetimi ve Google Tag Gateway etkin değildir. Sunum ve koruma işlemleri, sitenin güvenli çalışmasına yönelik meşru menfaate dayanır (GDPR madde 6(1)(f)). Aşağıdaki sağlayıcı açıklamaları yurt dışına veri aktarımını da ele alır."

[PrivacyPreferencesCopy]
other = "Dil tercihi bir yıl, yapay zekâ bilgilendirmesinin onayı 30 gün süreyle birinci taraf çerezlerde saklanır. Son uygulanan arama ölçütleri 30 gün boyunca HttpOnly çerezde tutulur; aramayı temizlemek bunları siler. Tema tercihi siz silene kadar tarayıcının yerel depolamasında kalır. Listeye dönüş konumu yalnızca açık tarayıcı sekmesinde tutulur. İletişim formunun güvenlik belirteci en fazla bir saat, alındı bilgisi beş dakika geçerlidir; mesajınızı içermezler. Bu işlevler talep ettiğiniz hizmeti sağlar (TDDDG §25(2)(2); GDPR madde 6(1)(f)). HTMX, localStorage içinde sayfa kopyaları saklamaz. Seçtiğiniz sıralama, bu siteye ait bir çerezde 30 gün boyunca saklanır. Arama terimleri ve filtreler sayfa adresine eklenir; paylaşılan bağlantılarda ve tarayıcı geçmişinde kalabilir."

[PrivacyMonitoringCopy]
other = "Sitenin güvenilir çalışması için teknik kayıtlarda istek yöntemi, sorgu parametreleri olmadan sayfa yolu, durum, süre ve istek kimlikleri tutulur. Uygulama kayıtlarına mesajlar, e-posta adresleri, çerezler veya ziyaretçilerin IP adresleri yazılmaz. Prometheus ölçümleri ve Loki kayıtları için saklama süresi 30 gün olarak ayarlanmıştır; Grafana bu teknik izleme verilerini gösterir. İletişim denemelerini sınırlandırmak için IP adresinin kendisini kaydetmeden, bu adresten türetilen takma bir kimliği ve deneme sayacını yalnızca uygulamanın belleğinde tutarız. Sınır, ilk denemeden itibaren 15 dakika geçerlidir. Süresi dolan sayaçlar bir sonraki iletişim denemesinde veya uygulama yeniden başlatıldığında silinir; yeni bir deneme yapılmazsa bellekte daha uzun kalabilirler. Amaç güvenlik ve güvenilirliktir (GDPR madde 6(1)(f)). Cloudflare’ın saklama süreleri ayrıdır."

[PrivacyCorrespondenceCopy]
other = "Bize yazdığınızda e-posta adresinizi, seçtiğiniz konuyu ve mesajınızı sorunuza yanıt vermek için işleriz (GDPR madde 6(1)(f)); gerektiğinde yasal yükümlülükler de geçerlidir (6(1)(c)). Form önce mesajınızı özel bir veritabanı gelen kutusuna kaydeder. SMTP2GO, contact@munichbrief.de adresine bildirim gönderir; Cloudflare Email Routing bunu Gmail gelen kutusuna iletir. Yanıtlar Apple Mail’de yazılır ve SMTP2GO üzerinden gönderilir. Mesajlar yapay zekâya gönderilmez. Sağlayıcı açıklamaları AEA dışındaki işlemleri de kapsar."

[PrivacyRetentionCopy]
other = "Yönetici gelen kutusundaki mesajlar, konu çözüldü olarak işaretlendikten 90 gün sonra otomatik silinir. Konu yeniden açılırsa bu süre iptal edilir. Açık talepler gözden geçirilir ve ihtiyaç sürdükçe saklanır. Devam eden bir uyuşmazlık veya yasal yükümlülük varsa, gerekçesi ve inceleme tarihi kaydedilerek mesaj tutulabilir. Gmail kopyaları ve gönderilen yanıtlar ayrıca gözden geçirilip silinir. Sağlayıcıların gönderim kayıtları kendi saklama kurallarına tabidir."

[PrivacyPostCopy]
other = "Yazışma adresine gelen mektuplar COCENTER / anschrift.net tarafından teslim alınır, açılır ve işletmecinin incelemesi için taranır. Bu işlem yazışmaları alabilmeye yönelik meşru menfaate veya yasal yükümlülüğe dayanır (GDPR madde 6(1)(f) veya (c)). Sağlayıcının açıklamasına göre kâğıt asıllar altı ay tutulur; taramalar, saklamayı gerektiren bir neden yoksa hesap kapatılana veya silme talebi iletilene kadar kalır. Ayrıntılar sağlayıcının gizlilik açıklamasındadır."

[PrivacySourcesCopy]
other = "Özetler, Polizeipräsidium München’in kamuya açık polis bültenlerinden hazırlanır. Almanca kaynak metinler ve RSS metin kayıtları; işleme, kaynak değişikliklerini denetleme ve erişimi kısıtlı inceleme amacıyla saklanır. Bu kayıtlar için şu anda belirlenmiş bir silme süresi yoktur. Herkese açık sayfalarda saklanan asıl metinler yerine özetler gösterilir. Haberlerde isim verilmese bile kişilerin kimliğinin anlaşılmasını sağlayan ayrıntılar bulunabilir. Bir haber sizi ilgilendiriyorsa veya hata içeriyorsa lütfen bize ulaşın. Düzeltme ve kişisel verilerle ilgili talepleri ayrı ayrı değerlendiririz."

[PrivacyRightsCopy]
other = "Geçerli kurallara bağlı olarak verilerinize erişme, düzeltme, silme, işlemeyi kısıtlama, meşru menfaate dayalı işlemeye itiraz etme ve uygun durumlarda verileri taşıma haklarınız olabilir. İletişim kurmak için hesap gerekmez. GDPR kapsamındaki hak talepleri normalde bir ay içinde yanıtlanır; yasal istisnalar ve editoryal kurallar sonucu etkileyebilir. Bavyera’da kamu dışı alandaki veri koruma konularında BayLDA’ya veya başka bir yetkili denetim makamına başvurabilirsiniz. Editoryal şikâyetlerde farklı kurallar geçerli olabilir."

