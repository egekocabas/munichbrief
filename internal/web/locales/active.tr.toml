AIDisclosureCopy = { other = "MunichBrief, Münih Polisinin resmî bildirimlerinden başlıklar, özetler, çeviriler, kategoriler ve bildirilen yer ile zaman veya polisin halktan yardım isteyip istemediği gibi yapılandırılmış ayrıntılar oluşturmak için yerel olarak çalıştırılan yapay zekâ kullanır. Yapay zekâ tarafından oluşturulan veya çıkarılan bilgiler hata içerebilir ya da özgün bildirim güncellendiğinde eskiyebilir. Her olay sayfası resmî polis kaynağını belirtir ve bağlantısını verir; doğrulanmış bilgi için lütfen bu kaynağa başvurun. MunichBrief bağımsız bir projedir ve Bavyera Polisiyle bağlantılı değildir. Adı geçen herkes, suçluluğu kanıtlanana kadar masum kabul edilir." }
AIDisclosurePreferenceCopy = { other = "“Anladım” seçildiğinde bu uyarı 30 gün boyunca hatırlanır." }
