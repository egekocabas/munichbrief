MonitoringCopy = { other = "Cloudflare, siteyi sunmak ve korumak için IP adresleri dâhil trafik verilerini işler. İncelememizde tarayıcıda çalışan bir analiz betiği görülmedi. İç izleme sistemi toplu ölçümleri ve istek yöntemi, yolu, durumu, süresi ve kimliklerinden oluşan günlükleri tutar. Yapılandırmada bunların saklama süresi 30 gündür; bu süre Cloudflare’ın kendi saklama ayarları hakkında bilgi vermez. Cloudflare, tarayıcıda bir analiz betiği çalışmasa da trafik istatistikleri oluşturabilir." }

CoverageCopy = { other = "Burada yalnızca yayımlanan polis bültenlerinden derlenen olaylar yer alır; tüm olayları kapsayan bir kayıt veya suç istatistiği sunulmaz. Güncellemeler MunichBrief’e gecikmeli yansıyabilir. Olayın tarihi ve saati bültenden alınır; saat belirtilmiş olsa da yaklaşık olabilir." }
