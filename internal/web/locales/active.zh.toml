[PrivacyControllerCopy]
other = "MunichBrief 由居住在巴伐利亚州的 Ege Kocabaş 以个人身份运营。上方地址为通信地址。有关个人数据处理的问题，可寄信或发送电子邮件联系。"

[PrivacyHostingCopy]
other = "网站、数据库和所有人工智能处理均在运营者位于德国的自有设备上运行。摘要、翻译和后续核查均在本地完成，原始资料不会发送给外部人工智能服务商。"

[PrivacyCloudflareCopy]
other = "Cloudflare 提供网站访问和安全防护，会处理包括 IP 地址在内的连接数据，也可在其网络端生成访问统计。Web Analytics 已设置为排除欧盟访客，并在其他地区自动插入性能测量脚本；浏览器安全限制可能阻止该脚本运行。这与网站传输和安全处理相互独立。Zaraz 同意管理及 Google Tag Gateway 未启用。网站传输与防护基于安全运营的合法利益（GDPR 第 6(1)(f) 条）。服务商政策说明了数据处理及跨境传输。"

[PrivacyPreferencesCopy]
other = "第一方 Cookie 将语言偏好保存一年，将人工智能提示确认保存 30 天，并通过 HttpOnly Cookie 将最近一次搜索条件保存 30 天；清除搜索会删除这些条件。主题保存在浏览器本地存储中，直到您清除；返回列表的位置仅保留在当前标签页。联系表单安全令牌最长有效一小时，收件确认最长五分钟，均不包含留言内容。这些功能支持您请求的服务（TDDDG §25(2)(2)；GDPR 第 6(1)(f) 条）。HTMX 不会在 localStorage 中保存页面快照。 您选择的时间排序方式会保存在本站的 Cookie 中，有效期为 30 天。"

[PrivacyMonitoringCopy]
other = "技术日志记录请求方法、不含查询参数的路径、状态、耗时及请求标识，不记录留言、电子邮箱、Cookie 或访客 IP 地址。Prometheus 指标及 Loki 日志的保留时间设置为 30 天，Grafana 用于内部查看。为限制联系尝试次数，我们仅在应用内存中保存计数器和由 IP 地址生成的假名标识，不保存原始 IP 地址。限制从首次尝试起持续 15 分钟。过期计数器会在下一次联系尝试或应用重启时删除；如果没有新的尝试，它们可能在内存中保留更久。这些措施用于安全与可靠运行（GDPR 第 6(1)(f) 条）。Cloudflare 有独立的保留规则。"

[PrivacyCorrespondenceCopy]
other = "我们处理您的电子邮箱、所选主题及留言，以回复咨询（GDPR 第 6(1)(f) 条），或履行适用的法定义务（第 6(1)(c) 条）。表单先把留言存入数据库的私人收件箱。SMTP2GO 向 contact@munichbrief.de 发送通知，Cloudflare Email Routing 再转发到 Gmail。回复在 Apple Mail 中撰写，经 SMTP2GO 发出。留言不会交给人工智能处理。下方服务商政策也说明欧洲经济区之外的处理。"

[PrivacyRetentionCopy]
other = "管理员收件箱中的留言在咨询标记为已解决 90 天后自动删除；重新打开咨询会取消期限。未解决的咨询会定期检查，并在仍有需要时保留。持续中的争议或法定义务可能需要继续保留，并记录原因与复查日期。Gmail 副本和已发送回复会另行检查、删除。服务商的发送记录遵循其各自的保留政策。"

[PrivacyPostCopy]
other = "寄往通信地址的信件由 COCENTER / anschrift.net 接收、拆封及扫描，以便运营者处理。依据为收取信件的合法利益或法定义务（GDPR 第 6(1)(f) 或 (c) 条）。服务商表示，纸质原件保存六个月；扫描件保留到关闭账户或提出删除请求，但有合理保留理由的情况除外。详情见其隐私政策。"

[PrivacySourcesCopy]
other = "摘要来源于 Polizeipräsidium München 的公开通报。德文原始文本及 RSS 文本快照保留用于处理、检查来源变化和受限审核。这些记录目前没有固定的删除期限。公开页面展示摘要，而非已存储的原文。即使没有姓名，报道中的细节也可能让人识别出相关个人。如果报道涉及您或存在错误，请联系我们。我们会逐一评估更正和隐私请求。"

[PrivacyRightsCopy]
other = "依适用规定，您可以请求访问、更正、删除、限制处理，在适用时请求数据可携带，或反对基于合法利益的处理。联系无需注册账户。GDPR 权利请求通常在一个月内答复；法律例外与编辑相关规则可能影响结果。对于巴伐利亚非公共部门的数据保护事项，您可向 BayLDA 或其他主管监管机构投诉；编辑相关投诉可能适用不同规则。"

