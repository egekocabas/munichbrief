name: Feature request
description: Propose a focused improvement to MunichBrief.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Privacy, source, and operational considerations
      description: Explain any effect on retained source text, public presentation, outbound access, or deployment.
    validations:
      required: true
