version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    groups:
      go-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:10"
      timezone: Europe/Berlin
    groups:
      frontend-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:20"
      timezone: Europe/Berlin
    groups:
      container-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Berlin
    groups:
      action-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)
