name: Publish container

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths-ignore:
      - ".github/workflows/ci.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "README.md"
      - "SECURITY.md"
      - "docs/**"
      - "charts/**/README.md"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Capture build metadata
    runs-on: ubuntu-24.04
    outputs:
      build_time: ${{ steps.build-time.outputs.value }}
    steps:
      - name: Capture build time
        id: build-time
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish immutable image
    needs: metadata
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1
    permissions:
      contents: read
      packages: write
    with:
      output: image
      push: true
      context: .
      platforms: linux/amd64,linux/arm64
      distribute: true
      fail-fast: false
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      job-name-prefix: Publish
      cache: true
      cache-scope: publish
      cache-mode: max
      sbom: true
      sign: "false"
      build-args: |
        VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
        COMMIT_SHA=${{ github.sha }}
        BUILD_TIME=${{ needs.metadata.outputs.build_time }}
      meta-images: ghcr.io/egekocabas/munichbrief
      meta-tags: |
        type=raw,value=sha-${{ github.sha }}
        type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
        type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
        type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
        type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      set-meta-labels: true
      meta-labels: |
        org.opencontainers.image.url=https://github.com/egekocabas/munichbrief
        org.opencontainers.image.documentation=https://github.com/egekocabas/munichbrief#readme
        org.opencontainers.image.licenses=MIT
        org.opencontainers.image.vendor=MunichBrief
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.created=${{ needs.metadata.outputs.build_time }}
      set-meta-annotations: true
      meta-annotations: |
        org.opencontainers.image.url=https://github.com/egekocabas/munichbrief
        org.opencontainers.image.documentation=https://github.com/egekocabas/munichbrief#readme
        org.opencontainers.image.licenses=MIT
        org.opencontainers.image.vendor=MunichBrief
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.created=${{ needs.metadata.outputs.build_time }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
