name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify generated frontend assets
        run: |
          npm ci
          npm run build
          git diff --exit-code -- internal/web/static

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Check documentation links
        run: node scripts/check-docs.mjs

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Verify formatting
        run: |
          git diff --check
          test -z "$(gofmt -l .)"

      - name: Verify module metadata
        run: go mod tidy -diff

      - name: Run static analysis
        run: |
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Check for reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Check for unreachable code
        run: go run golang.org/x/tools/cmd/deadcode@v0.49.0 -test ./...

      - name: Check workflows and shell scripts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          shellcheck scripts/*.sh

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Build application
        run: go build ./cmd/munichbrief

      - name: Validate Helm chart
        run: |
          helm lint --strict charts/munichbrief
          helm lint --strict charts/munichbrief --values deploy/example-values.yaml
          if helm template munichbrief charts/munichbrief --namespace munichbrief --set admin.enabled=true --set ingress.lan.enabled=true >/dev/null 2>&1; then
            echo "admin rendered without a Basic Auth reference" >&2
            exit 1
          fi
          if helm template munichbrief charts/munichbrief --namespace munichbrief --set admin.enabled=true --set ingress.lan.enabled=true --set admin.basicAuthSecret=munichbrief-admin-basic-auth --set admin.basicAuthMiddleware=munichbrief-munichbrief-admin-auth@kubernetescrd >/dev/null 2>&1; then
            echo "admin rendered with both Basic Auth reference forms" >&2
            exit 1
          fi
          if helm template munichbrief charts/munichbrief --namespace munichbrief --values deploy/example-values.yaml --set-string application.canonicalOrigin= >/dev/null 2>&1; then
            echo "public ingress rendered without a canonical origin" >&2
            exit 1
          fi
          if helm template munichbrief charts/munichbrief --namespace munichbrief --values deploy/example-values.yaml --set-string application.canonicalOrigin=https://example.com >/dev/null 2>&1; then
            echo "public ingress rendered with a canonical origin outside publicHosts" >&2
            exit 1
          fi
          if helm template munichbrief charts/munichbrief --namespace munichbrief --values deploy/example-values.yaml --set 'ingress.public.languageCodes={}' >/dev/null 2>&1; then
            echo "public ingress rendered without a language prefix" >&2
            exit 1
          fi
          if helm template munichbrief charts/munichbrief --namespace munichbrief --values deploy/example-values.yaml --set 'ingress.public.languageCodes={EN}' >/dev/null 2>&1; then
            echo "public ingress rendered with an invalid language prefix" >&2
            exit 1
          fi
          helm template munichbrief charts/munichbrief --namespace munichbrief > /tmp/munichbrief-default.yaml
          bash ./scripts/check-default-chart.sh /tmp/munichbrief-default.yaml
          helm template munichbrief charts/munichbrief --namespace munichbrief --values deploy/example-values.yaml > /tmp/munichbrief-rendered.yaml
          ./scripts/check-chart.sh /tmp/munichbrief-rendered.yaml
          helm template munichbrief charts/munichbrief --namespace munichbrief --values deploy/example-values.yaml --set 'ingress.public.languageCodes={de,en,pt-br}' > /tmp/munichbrief-multilingual.yaml
          grep -F -- 'path: /pt-br' /tmp/munichbrief-multilingual.yaml
