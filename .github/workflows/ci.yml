name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go and Helm checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify generated frontend assets
        run: |
          npm ci
          npm run build
          git diff --exit-code -- internal/web/static

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.2.4

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Run static analysis
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Build application
        run: go build ./cmd/munichbrief

      - name: Validate Helm chart
        run: |
          helm lint --strict charts/munichbrief
          helm lint --strict charts/munichbrief --values deploy/homelab-values.yaml
          if helm template munichbrief charts/munichbrief --namespace munichbrief --set admin.enabled=true --set ingress.lan.enabled=true >/dev/null 2>&1; then
            echo "admin rendered without a Basic Auth reference" >&2
            exit 1
          fi
          if helm template munichbrief charts/munichbrief --namespace munichbrief --values deploy/homelab-values.yaml --set admin.basicAuthMiddleware=munichbrief-munichbrief-admin-auth@kubernetescrd >/dev/null 2>&1; then
            echo "admin rendered with both Basic Auth reference forms" >&2
            exit 1
          fi
          helm template munichbrief charts/munichbrief --namespace munichbrief --values deploy/homelab-values.yaml > /tmp/munichbrief-rendered.yaml
          ./scripts/check-chart.sh /tmp/munichbrief-rendered.yaml

  container:
    name: Multi-platform container build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
