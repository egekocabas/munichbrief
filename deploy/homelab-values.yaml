# Reference values for the pi16 GitOps deployment. The homelab-infra
# repository owns the actual desired state and immutable image digest.
replicaCount: 1

image:
  repository: ghcr.io/egekocabas/munichbrief
  tag: v0.1.0
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-munichbrief

application:
  sourceMode: live
  presentationMode: review
  secureCookies: true
  pageSize: 20
  feedURL: https://www.polizei.bayern.de/rss/polizeiprasidium-munchen.xml
  userAgent: MunichBrief/0.1.0 (+https://github.com/egekocabas/munichbrief)
  syncInterval: 15m
  httpTimeout: 10s
  articleRefreshInterval: 6h
  aiEnabled: true
  ollamaBaseURL: http://192.168.178.102:11434
  ollamaModel: qwen3.5:4b
  aiInterval: 5s
  aiTimeout: 5m
  aiContextSize: 8192
  existingSecret: ""

ingress:
  enabled: true
  host: munichbrief.home.egekocabas.com

persistence:
  enabled: true
  storageClass: local-path
  accessMode: ReadWriteOnce
  size: 2Gi

serviceMonitor:
  enabled: true

networkPolicy:
  enabled: true
  pi8:
    enabled: true
    cidr: 192.168.178.102/32
    port: 11434
