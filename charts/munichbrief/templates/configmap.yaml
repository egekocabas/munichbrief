apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "munichbrief.fullname" . }}
  labels:
    {{- include "munichbrief.labels" . | nindent 4 }}
data:
  MUNICHBRIEF_ADDR: ":8080"
  MUNICHBRIEF_METRICS_ADDR: ":9090"
  MUNICHBRIEF_DATABASE_PATH: "/data/munichbrief.db"
  MUNICHBRIEF_SOURCE_MODE: {{ .Values.application.sourceMode | quote }}
  MUNICHBRIEF_PUBLIC_HOSTS: {{ join "," .Values.application.publicHosts | quote }}
  MUNICHBRIEF_ADMIN_ENABLED: {{ .Values.admin.enabled | quote }}
  MUNICHBRIEF_PRESENTATION_MODE: {{ .Values.application.presentationMode | quote }}
  MUNICHBRIEF_SECURE_COOKIES: {{ .Values.application.secureCookies | quote }}
  MUNICHBRIEF_PAGE_SIZE: {{ .Values.application.pageSize | quote }}
  MUNICHBRIEF_FEED_URL: {{ .Values.application.feedURL | quote }}
  MUNICHBRIEF_USER_AGENT: {{ .Values.application.userAgent | quote }}
  MUNICHBRIEF_HTTP_TIMEOUT: {{ .Values.application.httpTimeout | quote }}
  MUNICHBRIEF_ARTICLE_REFRESH_INTERVAL: {{ .Values.application.articleRefreshInterval | quote }}
  MUNICHBRIEF_AI_ENABLED: {{ .Values.application.aiEnabled | quote }}
  MUNICHBRIEF_AI_IMMEDIATE: {{ .Values.application.aiImmediate | quote }}
  MUNICHBRIEF_AI_WINDOW: {{ .Values.application.aiWindow | quote }}
  MUNICHBRIEF_OLLAMA_BASE_URL: {{ .Values.application.ollamaBaseURL | quote }}
  MUNICHBRIEF_OLLAMA_MODEL: {{ .Values.application.ollamaModel | quote }}
  MUNICHBRIEF_AI_INTERVAL: {{ .Values.application.aiInterval | quote }}
  MUNICHBRIEF_AI_TIMEOUT: {{ .Values.application.aiTimeout | quote }}
  MUNICHBRIEF_AI_CONTEXT_SIZE: {{ .Values.application.aiContextSize | quote }}
