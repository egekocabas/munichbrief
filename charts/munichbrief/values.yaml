replicaCount: 1

image:
  repository: ghcr.io/egekocabas/munichbrief
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

application:
  # Used for host-aware public presentation and path restrictions.
  publicHosts: []
  # Required when publicHosts is non-empty; must name one of those HTTPS hosts.
  canonicalOrigin: ""
  sourceMode: fixture
  presentationMode: review
  secureCookies: true
  pageSize: 20
  feedURL: https://www.polizei.bayern.de/rss/polizeiprasidium-munchen.xml
  userAgent: MunichBrief/0.1.0 (+https://github.com/egekocabas/munichbrief)
  httpTimeout: 10s
  articleRefreshInterval: 6h
  aiEnabled: false
  aiImmediate: false
  aiWindow: "03:00-08:00"
  ollamaBaseURL: http://127.0.0.1:11434
  aiInterval: 15s
  aiTimeout: 15m
  aiContextSize: 8192
  existingSecret: ""

service:
  type: ClusterIP
  webPort: 80
  metricsPort: 9090

ingress:
  lan:
    enabled: false
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    host: munichbrief.internal.example
    tls: []
  public:
    enabled: false
    className: traefik
    annotations: {}
    hosts: []
    # Must match the application's compile-time reader language registry.
    languageCodes:
      - de
      - en
      - tr
      - hr
      - it
      - uk
      - bs
      - zh
      - hi
      - es
      - fr
    tls: []

admin:
  enabled: false
  # Set exactly one auth reference when enabling the admin and LAN ingress.
  basicAuthMiddleware: ""
  basicAuthSecret: ""

persistence:
  enabled: true
  storageClass: local-path
  accessMode: ReadWriteOnce
  size: 2Gi
  annotations:
    helm.sh/resource-policy: keep

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

networkPolicy:
  enabled: true
  ingressNamespaceNames:
    - kube-system
  metricsNamespaceNames:
    - observability
  allowPublicHTTPS: true
  pi8:
    enabled: false
    cidr: 192.168.1.100/32
    port: 11434

serviceMonitor:
  enabled: false
  interval: 30s
  additionalLabels:
    release: kube-prometheus-stack

nodeSelector: {}
tolerations: []
affinity: {}
