replicaCount: 1

image:
  repository: ghcr.io/egekocabas/munichbrief
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

application:
  sourceMode: live
  pageSize: 20
  feedURL: https://www.polizei.bayern.de/rss/polizeiprasidium-munchen.xml
  userAgent: MunichBrief/0.1.0 (+https://github.com/egekocabas/munichbrief)
  syncInterval: 15m
  httpTimeout: 10s
  articleRefreshInterval: 6h
  existingSecret: ""

service:
  type: ClusterIP
  webPort: 80
  metricsPort: 9090

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  host: munichbrief.home.egekocabas.com
  tls: []

persistence:
  enabled: true
  storageClass: local-path
  accessMode: ReadWriteOnce
  size: 2Gi
  annotations:
    helm.sh/resource-policy: keep

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

networkPolicy:
  enabled: true
  ingressNamespaceNames:
    - kube-system
  metricsNamespaceNames:
    - observability
  allowPublicHTTPS: true
  pi8:
    enabled: false
    cidr: 192.168.178.102/32
    port: 8080

serviceMonitor:
  enabled: false
  interval: 30s
  additionalLabels:
    release: kube-prometheus-stack

nodeSelector: {}
tolerations: []
affinity: {}
